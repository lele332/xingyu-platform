<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星屿 · 桌面宠物</title>
<script type="importmap">
{"imports":{"three":"/js/vendor/three/three.module.js","three/addons/":"/js/vendor/three/addons/"}}
</script>
<script src="/js/vendor/l2d-widget.min.js?v=20260910.1"></script>
<script src="/js/airi-bootstrap.js?v=20260910.1"></script>
<style>
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;color:#eaf6ff;
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-user-select:none;user-select:none}
  #dragLayer{position:absolute;inset:0;z-index:0;border-radius:30px}
  #l2dHost{position:absolute;inset:0;z-index:1;pointer-events:none}
  #l2dHost canvas{pointer-events:auto}
  canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;background:transparent}

  #brand{position:absolute;left:18px;top:14px;z-index:20;display:flex;align-items:center;gap:7px;
    padding:7px 10px;border-radius:14px;border:1px solid rgba(255,255,255,.09);background:rgba(7,16,24,.52);
    backdrop-filter:blur(18px);font-size:11px;letter-spacing:.10em;color:rgba(226,238,252,.74);
    opacity:.52;transition:opacity .22s,transform .22s}
  body:hover #brand,body.chat-open #brand{opacity:.92}

  #loading{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);display:none;flex-direction:column;
    align-items:center;gap:9px;z-index:24;pointer-events:none;color:rgba(226,238,252,.78)}
  #loading.on{display:flex}
  #loading .ring{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.14);border-top-color:#7dd3fc;animation:spin .8s linear infinite}
  #loading .txt{font-size:10px;letter-spacing:.14em}
  @keyframes spin{to{transform:rotate(360deg)}}

  #chatPanel{position:absolute;left:12px;right:12px;bottom:62px;z-index:30;max-height:min(58vh,430px);
    display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:9px;padding:11px;border-radius:22px;
    border:1px solid rgba(255,255,255,.10);background:rgba(7,16,24,.80);backdrop-filter:blur(24px) saturate(150%);
    box-shadow:0 22px 64px rgba(0,0,0,.24);opacity:0;transform:translateY(18px) scale(.98);pointer-events:none;
    transition:opacity .24s cubic-bezier(.32,.72,.16,1),transform .24s cubic-bezier(.32,.72,.16,1)}
  body.chat-open #chatPanel{opacity:1;transform:none;pointer-events:auto}
  #chatHead{display:flex;align-items:center;gap:8px;color:rgba(226,238,252,.82);font-size:11px;letter-spacing:.10em}
  #chatHead .mark{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#7dd3fc,#818cf8);box-shadow:0 0 0 4px rgba(125,211,252,.10)}
  #chatHead .status{margin-left:auto;font-size:10px;color:rgba(226,238,252,.48)}
  #chatBody{min-height:90px;overflow-y:auto;padding-right:4px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin}
  .msg{max-width:88%;padding:8px 10px;border-radius:15px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12.5px}
  .msg.ai{align-self:flex-start;color:#eaf6ff;border:1px solid rgba(125,211,252,.14);background:rgba(125,211,252,.10)}
  .msg.user{align-self:flex-end;color:#03192a;background:linear-gradient(135deg,#7dd3fc,#818cf8)}
  .msg.error{align-self:flex-start;color:#fecaca;border:1px solid rgba(248,113,113,.24);background:rgba(248,113,113,.10)}
  .msg.thinking span{display:inline-block;width:5px;height:5px;margin-right:3px;border-radius:50%;background:rgba(226,238,252,.64);animation:blink 1.2s infinite}
  .msg.thinking span:nth-child(2){animation-delay:.18s}
  .msg.thinking span:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
  #chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  #chips::-webkit-scrollbar{display:none}
  .chip{flex:none;min-height:30px;padding:6px 10px;border:1px solid rgba(255,255,255,.10);border-radius:99px;
    background:rgba(255,255,255,.05);color:rgba(226,238,252,.74);font-size:11px;cursor:pointer;transition:.18s}
  .chip:hover{color:#fff;border-color:rgba(125,211,252,.38);background:rgba(125,211,252,.10);transform:translateY(-1px)}
  #chatForm{display:flex;gap:7px}
  #chatInput{flex:1;min-width:0;min-height:38px;padding:9px 11px;border:1px solid rgba(255,255,255,.10);border-radius:14px;
    outline:0;background:rgba(255,255,255,.06);color:#fff;font:inherit;font-size:12.5px;-webkit-user-select:text;user-select:text}
  #chatInput::placeholder{color:rgba(226,238,252,.38)}
  #chatInput:focus-visible{box-shadow:0 0 0 2px rgba(7,16,24,.9),0 0 0 5px rgba(56,189,248,.62)}
  #btnSend{width:38px;min-height:38px;border:0;border-radius:13px;background:linear-gradient(135deg,#7dd3fc,#818cf8);
    color:#03192a;font-weight:700;cursor:pointer;transition:transform .16s,filter .16s}
  #btnSend:hover{filter:brightness(1.06)}
  #btnSend:active{transform:scale(.96)}

  .dock{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:35;display:flex;gap:6px;padding:5px;
    border-radius:18px;border:1px solid rgba(255,255,255,.09);background:rgba(7,16,24,.62);backdrop-filter:blur(20px);
    box-shadow:0 14px 36px rgba(0,0,0,.16);opacity:.22;transition:opacity .22s,transform .22s}
  body:hover .dock,body.chat-open .dock{opacity:1}
  .tool{width:30px;height:30px;border:0;border-radius:11px;background:rgba(255,255,255,.06);color:rgba(226,238,252,.78);
    cursor:pointer;font-size:11px;font-weight:650;transition:.18s}
  .tool:hover{color:#fff;background:rgba(125,211,252,.16);transform:translateY(-1px)}
  .tool.active{color:#03192a;background:linear-gradient(135deg,#7dd3fc,#818cf8)}
  .tool.close:hover{background:rgba(248,113,113,.20)}
  #airiPetFrame{position:absolute;inset:0;z-index:2;width:100%;height:100%;border:0;background:transparent}
  body.mode-airi #chatPanel{bottom:62px}
  @media (prefers-reduced-motion: reduce){*{transition-duration:1ms!important;animation-duration:1ms!important}}
</style>
</head>
<body>
<div id="dragLayer" class="pywebview-drag-region"></div>
<div id="l2dHost"></div>
<div id="brand"><span>✦</span><span>墨小星</span></div>
<div id="loading"><div class="ring"></div><div class="txt">唤醒中</div></div>

<section id="chatPanel" aria-label="宠物对话">
  <header id="chatHead"><span class="mark"></span><span>学习搭子 · 墨小星</span><span id="chatStatus">就绪</span></header>
  <div id="chatBody"></div>
  <div id="chips">
    <button class="chip" type="button" data-ask="我只有 40 分钟，帮我安排一段高效学习。">40分钟计划</button>
    <button class="chip" type="button" data-ask="我有点拖延，给我一个立刻能开始的小任务。">开始任务</button>
    <button class="chip" type="button" data-ask="我刚学完一小时，给我一个简短复盘问题。">复盘提问</button>
    <button class="chip" type="button" data-ask="我有点累，用一句话鼓励我一下。">鼓励我</button>
  </div>
  <form id="chatForm">
    <input id="chatInput" type="text" autocomplete="off" placeholder="说点什么…">
    <button id="btnSend" type="submit" aria-label="发送">↑</button>
  </form>
</section>

<div class="dock">
  <button class="tool active" id="btnChat" title="对话">✦</button>
  <button class="tool active" data-mode="live2d" title="Live2D">L</button>
  <button class="tool" data-mode="airi" title="AIRI Runtime">A</button>
  <button class="tool close" id="btnClose" title="关闭">✕</button>
</div>

<script>
  const host=document.getElementById('l2dHost');
  const loadingEl=document.getElementById('loading');
  const buttons=[...document.querySelectorAll('[data-mode]')];
  const chatBody=document.getElementById('chatBody');
  const chatInput=document.getElementById('chatInput');
  const chatStatus=document.getElementById('chatStatus');
  let mode=localStorage.getItem('xingyu_pet_mode')||'live2d';
  let widget=null, widgetRoot=null;
  let renderer=null,scene=null,camera=null,mixer=null,model=null,clock=null,airiReady=false,airiLoading=false;
  let aiConfigured=null;
  const chatHistory=[];

  function api(){ return window.pywebview && window.pywebview.api; }
  function showLoading(txt){ loadingEl.querySelector('.txt').textContent=txt||'唤醒中'; loadingEl.classList.add('on'); }
  function hideLoading(){ loadingEl.classList.remove('on'); }
  function setActive(){
    buttons.forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
    localStorage.setItem('xingyu_pet_mode',mode);
  }

  function scrollChat(){ chatBody.scrollTop=chatBody.scrollHeight; }
  function addMsg(role,text,cls=''){
    const el=document.createElement('div');
    el.className='msg '+role+' '+cls;
    el.textContent=text;
    chatBody.appendChild(el);
    scrollChat();
    return el;
  }
  function setThinking(on){
    const old=chatBody.querySelector('.thinking'); if(old) old.remove();
    if(!on) return;
    const el=document.createElement('div');
    el.className='msg ai thinking';
    el.innerHTML='<span></span><span></span><span></span>';
    chatBody.appendChild(el); scrollChat();
  }
  function setStatus(text){ chatStatus.textContent=text||'就绪'; }

  function removeWidgetRoot(){
    try{
      if(widgetRoot && widgetRoot.parentElement!==document.body) document.body.appendChild(widgetRoot);
    }catch(e){}
    widgetRoot=null;
  }
  function mountWidget(){
    try{
      let n=widgetRoot;
      if(!n||!n.isConnected){
        const candidates=[...document.body.children].filter(x=>x.tagName==='DIV'&&x.querySelector('canvas')&&String(x.style.zIndex||'')==='9999');
        n=candidates[candidates.length-1];
      }
      if(!n) return;
      widgetRoot=n; host.appendChild(n);
      const w=Math.min(270,host.clientWidth||270);
      const h=Math.min(310,host.clientHeight||310);
      Object.assign(n.style,{
        position:'absolute',left:'50%',marginLeft:(-w/2)+'px',right:'auto',bottom:'18px',
        width:w+'px',height:h+'px',zIndex:'2',pointerEvents:'auto'
      });
    }catch(e){}
  }

  function disposeAiri(){
    try{ renderer&&renderer.setAnimationLoop(null); }catch(e){}
    renderer=scene=camera=mixer=model=clock=null; airiReady=airiLoading=false;
    [...host.querySelectorAll('canvas[data-airi-canvas]')].forEach(c=>c.remove());
    const frame=document.getElementById('airiPetFrame'); if(frame) frame.remove();
  }

  async function startLive2D(){
    disposeAiri(); hideLoading(); setStatus('正在唤醒');
    if(!widget){
      removeWidgetRoot();
      if(!window.L2D_WIDGET||!window.L2D_WIDGET.createWidget){ showLoading(); return setTimeout(startLive2D,160); }
      widget=window.L2D_WIDGET.createWidget({
        model:{path:'/assets/live2d/koharu/model.json?v=20260910.1',tips:{welcomeMessage:[],messages:[]}},
        position:'bottom-left',size:270,menus:false,statusBar:false,logLevel:'warn'
      });
      setTimeout(()=>{hideLoading(); if(chatBody.children.length===0){
        addMsg('ai','我在这里。可以直接聊，也可以让我帮你拆任务、安排专注。');
      } setStatus('就绪');},2600);
    }
    setTimeout(mountWidget,0);
  }

  async function startAiri(){
    if(airiReady||airiLoading){ return; }
    disposeAiri(); try{ widget&&widget.destroy(); }catch(e){} widget=null; removeWidgetRoot();
    airiLoading=true; setStatus('AIRI 启动中'); showLoading('正在启动 AIRI');
    try{ window.XingyuAiriBootstrap && window.XingyuAiriBootstrap.install({autoMic:false,withCards:true,lightStage:true}); }
    catch(e){ console.warn('[pet] AIRI 预置失败',e); }
    const frame=document.createElement('iframe');
    frame.id='airiPetFrame'; frame.src='/airi/'; frame.title='AIRI';
    frame.allow='microphone; camera; autoplay; clipboard-write'; frame.referrerPolicy='no-referrer';
    frame.style.cssText='position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent';
    host.appendChild(frame);
    frame.onload=()=>setTimeout(()=>{airiLoading=false;airiReady=true;hideLoading();setStatus('AIRI 就绪');},1500);
    setTimeout(()=>{airiLoading=false;airiReady=true;hideLoading();setStatus('AIRI 就绪');},12000);
  }

  async function setMode(m){
    mode=m; setActive(); document.body.classList.toggle('mode-airi',m==='airi');
    try{ api()&&api().set_mode&&await api().set_mode(m); }catch(e){}
    if(m==='live2d')startLive2D();else startAiri();
  }

  /* ---------- 智能对话：本机 AI 代理 + 离线兜底 ---------- */
  async function checkAi(){
    if(aiConfigured!==null) return aiConfigured;
    try{
      const r=await fetch('/ai-proxy/__ai_health__',{cache:'no-store'});
      const j=await r.json();
      aiConfigured=!!(j&&j.configured);
    }catch(e){ aiConfigured=false; }
    return aiConfigured;
  }

  function localReply(text){
    const q=text.toLowerCase();
    if(/计划|安排|规划/.test(q)) return '先把 40 分钟切成两段：25 分钟做最难的一件事，10 分钟整理结论，剩下 5 分钟休息。现在先写出第一句，就算开始。';
    if(/累|不想|拖延|坚持/.test(q)) return '不用逼自己完成全部，先做 5 分钟。计时开始后，你只需要写下一个标题或一道题。';
    if(/复盘|总结/.test(q)) return '问自己三个问题：今天真正推进了什么？哪里卡住最久？明天第一件事是什么？';
    if(/你好|在吗|hi/.test(q)) return '我在。想安排任务，还是先聊两句？';
    return '我在听。可以告诉我任务、剩余时间和当前卡点，我来帮你把它拆到下一步。';
  }

  async function askAI(text){
    addMsg('user',text);
    setThinking(true); setStatus('思考中');
    try{
      const configured=await checkAi();
      if(!configured) throw new Error('offline');
      const now=new Date();
      const system='你是星屿桌面宠物「墨小星」，学生身边的学习搭子。用简体中文，语气温和、元气、具体；一般不超过三句话。你能帮用户拆解任务、安排专注、提出复盘问题，但不要编造任务数据。当前时间：'+now.toLocaleString('zh-CN');
      const body={
        model:'deepseek-chat',
        messages:[{role:'system',content:system},...chatHistory.slice(-10),{role:'user',content:text}],
        temperature:.65
      };
      const r=await fetch('/ai-proxy/chat/completions',{
        method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)
      });
      const j=await r.json();
      const content=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
      if(!r.ok||typeof content!=='string') throw new Error((j&&(j.error||j.message))||('HTTP '+r.status));
      chatHistory.push({role:'user',content:text},{role:'assistant',content});
      if(chatHistory.length>16) chatHistory.splice(0,chatHistory.length-16);
      addMsg('ai',content);
      setStatus('就绪');
    }catch(err){
      setThinking(false);
      if(String(err.message)==='offline'){
        addMsg('ai',localReply(text));
        setStatus('离线搭子');
      }else{
        addMsg('ai','这条没连上 AI，先给你本地建议：\n'+localReply(text),'error');
        setStatus('离线兜底');
      }
    }finally{
      setThinking(false);
    }
  }

  /* ---------- UI ---------- */
  document.getElementById('btnChat').addEventListener('click',()=>{
    document.body.classList.toggle('chat-open');
    if(document.body.classList.contains('chat-open')){
      setTimeout(()=>chatInput.focus(),180);
      if(chatBody.children.length===0) addMsg('ai','我在这里。直接说“我只有40分钟”，我来帮你安排。');
    }
  });
  document.getElementById('chatForm').addEventListener('submit',e=>{
    e.preventDefault();
    const text=chatInput.value.trim(); if(!text)return;
    chatInput.value=''; askAI(text);
  });
  document.getElementById('chips').addEventListener('click',e=>{
    const btn=e.target.closest('.chip'); if(!btn)return; askAI(btn.dataset.ask);
  });
  document.getElementById('btnClose').addEventListener('click',async e=>{
    e.stopPropagation();
    try{ api()&&api().close_pet&&await api().close_pet(); }catch(err){ window.close(); }
  });
  buttons.forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();setMode(b.dataset.mode);}));
  ['pointerdown','mousedown','keydown','touchstart'].forEach(ev=>{
    document.querySelector('.dock').addEventListener(ev,e=>e.stopPropagation(),{passive:true});
    document.getElementById('chatPanel').addEventListener(ev,e=>e.stopPropagation(),{passive:true});
  });

  function resize(){
    const w=host.clientWidth||300,h=host.clientHeight||400;
    if(renderer){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
    if(mode==='live2d'&&widget)mountWidget();
  }
  addEventListener('resize',resize,{passive:true});

  setActive();
  document.body.classList.toggle('mode-airi',mode==='airi');
  if(mode==='airi')startAiri();else startLive2D();
  setTimeout(resize,150);
  window.__xingyuPetReady=true;
</script>
</body>
</html>
