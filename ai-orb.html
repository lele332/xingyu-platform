<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI · 液态玻璃球</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  .orb-err {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center; text-align: center;
    color: rgba(255,255,255,.7); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: .12em;
    background: #000; padding: 20px;
  }
</style>
</head>
<body>
<canvas id="orb" aria-label="AI 液态玻璃球"></canvas>
<div class="orb-err" id="orbErr"></div>
<script>
(function(){
  "use strict";
  var shaderUrl = "./ai-orb-shader.wgsl?v=20260816.1";

  /* ---- 118 号参数（siri 预设） ---- */
  var Ev = { glassEnabled: true, speed: 1, radius: .72, contourDeform: 0, bandDensity: 2, chromaticShift: .42, metalScale: .77, metalStretch: .23, metalAngle: 65, metalOffset: 0, metalPhase: 0, metalEvolution: 1, metalRoughness: .22, metalDepth: .25, zoom: .3, warp: 3, ridgeAmt: .5, sharp: 2.2, shade: .3, sheen: .36, gloss: .28, glassOpacity: .42, shellMidAlpha: .2, shellEdgeAlpha: .22, exposure: 1, edgeSoftness: .005, edgeGlow: 0, colorA: "#F7FBFF", colorB: "#D6E8F7", colorC: "#A8C8F0", colorD: "#6F9EE8", highlightColor: "#FFFFFF", shellInner: "#FFFFFF", shellMid: "#D6E8F7", shellEdge: "#6F9EE8", sheenColor: "#EAF4FF", specColor: "#DCEAFF", canvasColor: "#000000", glowColor: "#6F9EE8" };
  var Av = { siri: 9, voiceWave: 19, aurora: 10, plasma: 11, chrome: 12, opal: 13, spectrum: 14, frost: 15, blueDrop: 20, violetEmber: 21, chromaticMetal: 22 };
  var Nv = ["#F7FBFF", "#EFF6FD", "#E0EEF9", "#D4E6F7", "#BBD5F3", "#A6C7F0", "#87B0EB", "#6F9EE8", "#6F9EE8", "#6F9EE8", "#6F9EE8", "#6F9EE8"];
  function Pv(e){ var t = e.slice(1); return [parseInt(t.slice(0,2),16)/255, parseInt(t.slice(2,4),16)/255, parseInt(t.slice(4,6),16)/255, 1]; }
  function Fv(e, t, n, r, i){
    e.fill(0); e[0]=t; e[1]=n; e[2]=r;
    e.set([i.speed,i.radius,i.zoom,i.warp,i.ridgeAmt,i.sharp,i.shade,i.sheen,i.gloss,i.shellMidAlpha,i.shellEdgeAlpha,i.exposure,Av[i.style],i.edgeSoftness,i.edgeGlow,0,+!!i.glassEnabled,i.glassOpacity,i.contourDeform,i.bandDensity,i.chromaticShift,i.metalScale,i.metalStretch,i.metalAngle,i.metalOffset,i.metalPhase,i.metalEvolution,i.metalRoughness,i.metalDepth],3);
    [i.colorA,i.colorB,i.colorC,i.colorD,i.highlightColor,i.shellInner,i.shellMid,i.shellEdge,i.sheenColor,i.specColor,i.canvasColor,i.glowColor].concat(Nv).forEach(function(c,n){ e.set(Pv(c), 32+n*4); });
  }
  var preset = Object.assign({}, Ev, { style: "siri", speed: .82, zoom: .36, warp: 3.2, ridgeAmt: .5, sharp: 2.2, shade: .12, sheen: .28, gloss: .24, glassOpacity: .44, shellMidAlpha: .18, shellEdgeAlpha: .18, exposure: 2, colorA: "#FFD86B", colorB: "#82F4FF", colorC: "#FF7BD5", colorD: "#8E6CFF", shellMid: "#9BF4FF", shellEdge: "#C5A9FF", canvasColor: "#030409", glowColor: "#956CFF" });
  try {
    var saved = localStorage.getItem("xingyu.orbPreset");
    if (saved) { var p = JSON.parse(saved); if (p && typeof p === "object") { preset = Object.assign(preset, p); } }
  } catch (e) {}

  var canvas = document.getElementById("orb");
  var errBox = document.getElementById("orbErr");
  function showError(msg){
    errBox.style.display = "flex";
    errBox.textContent = "WebGPU 不可用：" + msg;
  }

  /* ---- 渲染器 ---- */
  async function start(shader){
    var stopped = false, raf = 0, device = null, started = false, errored = false;
    function fail(err){
      if (stopped || errored) return;
      errored = true; cancelAnimationFrame(raf); if (device) device.destroy();
      showError(err && err.message ? err.message : String(err));
    }
    try {
      if (!navigator.gpu) throw new Error("当前浏览器不支持 WebGPU");
      var adapter = await navigator.gpu.requestAdapter();
      if (!adapter) throw new Error("未找到可用的 WebGPU 适配器");
      device = await adapter.requestDevice();
      if (stopped) { device.destroy(); return; }
      var ctx = canvas.getContext("webgpu");
      if (!ctx) throw new Error("无法创建 WebGPU 画布上下文");
      var format = navigator.gpu.getPreferredCanvasFormat();
      ctx.configure({ device: device, format: format, alphaMode: "premultiplied" });
      var module = device.createShaderModule({ label: "orb-glass-liquid", code: shader });
      var msgs = (await module.getCompilationInfo()).messages.filter(function(m){ return m.type === "error"; });
      if (msgs.length) throw new Error(msgs.map(function(m){ return m.lineNum + ":" + m.linePos + " " + m.message; }).join("\\n"));
      var pipeline = device.createRenderPipeline({
        label: "orb-glass-liquid-pipeline", layout: "auto",
        vertex: { module: module, entryPoint: "vs_main" },
        fragment: { module: module, entryPoint: "fs_main", targets: [{ format: format }] },
        primitive: { topology: "triangle-list" }
      });
      var params = new Float32Array(128);
      var ubuf = device.createBuffer({ size: params.byteLength, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
      var bind = device.createBindGroup({ layout: pipeline.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: ubuf } }] });
      var t0 = performance.now();
      device.lost.then(function(e){ fail(new Error("WebGPU 设备已断开：" + (e.message || e.reason))); });
      device.addEventListener("uncapturederror", function(e){ e.preventDefault(); fail(new Error("WebGPU 渲染错误：" + e.error.message)); });
      function resize(){
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var w = Math.max(1, Math.floor(canvas.clientWidth * dpr));
        var h = Math.max(1, Math.floor(canvas.clientHeight * dpr));
        if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      }
      function frame(now){
        if (stopped || errored || !device) return;
        try {
          resize();
          Fv(params, canvas.width, canvas.height, (now - t0) / 1000, preset);
          device.queue.writeBuffer(ubuf, 0, params);
          var enc = device.createCommandEncoder();
          var pass = enc.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), clearValue: { r: 0, g: 0, b: 0, a: 1 }, loadOp: "clear", storeOp: "store" }] });
          pass.setPipeline(pipeline); pass.setBindGroup(0, bind); pass.draw(3, 1, 0, 0); pass.end();
          device.queue.submit([enc.finish()]);
          if (!started) { started = true; }
          raf = requestAnimationFrame(frame);
        } catch (e) { fail(e instanceof Error ? e : new Error(String(e))); }
      }
      raf = requestAnimationFrame(frame);
    } catch (e) { fail(e instanceof Error ? e : new Error(String(e))); }
  }

  fetch(shaderUrl)
    .then(function(r){ if (!r.ok) throw new Error("shader fetch " + r.status); return r.text(); })
    .then(start)
    .catch(function(e){ showError(e && e.message ? e.message : String(e)); });

  /* 编辑器保存后实时更新：另一个窗口写入 localStorage 时，本页立即应用到球体 */
  window.addEventListener("storage", function(e){
    if (e.key !== "xingyu.orbPreset") return;
    try {
      if (e.newValue) {
        var p = JSON.parse(e.newValue);
        if (p && typeof p === "object") { preset = Object.assign(preset, p); }
      }
    } catch (err) {}
  });
})();
</script>
</body>
</html>
