<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" role="img" aria-label="道路平面线形要素示意：切线、缓和曲线、圆曲线与 ZH HY QZ YH HZ 五个主点">
  <title>平面线形五主点与三个要素（转角 α、切线长 T、外距 E）</title>
  <g font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#8a8a8a">
    <path d="M60 215 L330 80" stroke="#c8c8c8" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.7"/>
    <path d="M330 80 L600 215" stroke="#c8c8c8" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.7"/>

    <path d="M170 160 C206 163 240 169 268 175 C300 187 360 187 392 175 C420 169 454 163 490 160" fill="none" stroke="#0a84ff" stroke-width="2.2"/>

    <circle cx="330" cy="80" r="3.4" fill="#ff9f0a"/>
    <text x="342" y="70" fill="#ff9f0a">JD 交点（两条导线相交）</text>
    <path d="M364 97 A38 38 0 0 1 296 97" fill="none" stroke="#ff9f0a" stroke-width="1.1"/>
    <text x="330" y="132" text-anchor="middle" fill="#ff9f0a" font-size="11.5">转角 α</text>

    <path d="M330 80 V186" stroke="#bf5af2" stroke-width="1.1" stroke-dasharray="3 3"/>
    <text x="338" y="140" fill="#bf5af2" font-size="11.5">E 外距</text>

    <path d="M170 160 L330 80" stroke="#30d158" stroke-width="1.1" stroke-dasharray="3 3" opacity="0.8"/>
    <text x="212" y="112" fill="#30d158" font-size="11.5">T 切线长</text>

    <path d="M330 186 V172" stroke="#0a84ff" stroke-width="1" stroke-dasharray="3 3" opacity="0.75"/>
    <text x="336" y="168" fill="#0a84ff" font-size="11">R 指向圆心</text>

    <circle cx="170" cy="160" r="3" fill="#0a84ff"/>
    <circle cx="268" cy="175" r="3" fill="#0a84ff"/>
    <circle cx="330" cy="186" r="3.4" fill="#0a84ff"/>
    <circle cx="392" cy="175" r="3" fill="#0a84ff"/>
    <circle cx="490" cy="160" r="3" fill="#0a84ff"/>

    <text x="128" y="142" fill="#0a84ff">ZH 直缓点</text>
    <text x="238" y="205" fill="#0a84ff">HY 缓圆点</text>
    <text x="330" y="222" text-anchor="middle" fill="#0a84ff">QZ 曲中点</text>
    <text x="400" y="205" fill="#0a84ff">YH 圆缓点</text>
    <text x="500" y="142" fill="#0a84ff">HZ 缓直点</text>

    <path d="M170 232 H268" stroke="#c8c8c8" stroke-width="0.9" opacity="0.6"/>
    <text x="219" y="246" text-anchor="middle" font-size="11" fill="#8a8a8a">缓和段 Ls</text>
    <path d="M392 232 H490" stroke="#c8c8c8" stroke-width="0.9" opacity="0.6"/>
    <text x="441" y="246" text-anchor="middle" font-size="11" fill="#8a8a8a">缓和段 Ls</text>
    <text x="330" y="262" text-anchor="middle" font-size="11" fill="#8a8a8a">中间只含圆曲线（半径 R）；两端各插一段缓和曲线，曲率与超高在此过渡</text>
    <text x="330" y="284" text-anchor="middle" font-size="11" fill="#8a8a8a">五个主点顺序固定：ZH → HY → QZ → YH → HZ，桩号必须连续可算，作业里常要求逐桩推算</text>
  </g>
</svg>
