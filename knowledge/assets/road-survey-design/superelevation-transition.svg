<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" role="img" aria-label="超高过渡三阶段示意：正常双向路拱、内侧抬平的临界断面、全超高单向坡">
  <title>超高过渡的三阶段（绕中线旋转法）</title>
  <g font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#8a8a8a">
    <text x="110" y="40" text-anchor="middle" fill="#0a84ff">① 正常路拱（双向坡）</text>
    <text x="330" y="40" text-anchor="middle" fill="#ff9f0a">② 内侧抬平（临界断面）</text>
    <text x="550" y="40" text-anchor="middle" fill="#30d158">③ 全超高（单向坡）</text>

    <path d="M30 174 L110 158 L190 174" fill="none" stroke="#0a84ff" stroke-width="2.2"/>
    <path d="M110 158 V196" stroke="#c8c8c8" stroke-width="0.9" stroke-dasharray="3 3" opacity="0.7"/>
    <text x="110" y="212" text-anchor="middle" font-size="11" fill="#8a8a8a">中线（旋转轴，高程不变）</text>
    <text x="30" y="192" font-size="11">外侧</text>
    <text x="160" y="192" font-size="11">内侧</text>
    <text x="110" y="236" text-anchor="middle" font-size="11" fill="#0a84ff">路拱坡 i_g，排水向两侧</text>

    <path d="M250 158 L330 158 L410 190" fill="none" stroke="#ff9f0a" stroke-width="2.2"/>
    <path d="M330 158 V196" stroke="#c8c8c8" stroke-width="0.9" stroke-dasharray="3 3" opacity="0.7"/>
    <text x="330" y="212" text-anchor="middle" font-size="11" fill="#8a8a8a">中线不动</text>
    <path d="M250 150 H330" stroke="#ff9f0a" stroke-width="0.9" opacity="0.6"/>
    <text x="288" y="146" text-anchor="middle" font-size="11" fill="#ff9f0a">内侧抬高</text>
    <text x="330" y="236" text-anchor="middle" font-size="11" fill="#ff9f0a">内侧半幅抬平，已成单向坡</text>

    <path d="M470 142 L550 158 L630 174" fill="none" stroke="#30d158" stroke-width="2.2"/>
    <path d="M550 158 V196" stroke="#c8c8c8" stroke-width="0.9" stroke-dasharray="3 3" opacity="0.7"/>
    <text x="550" y="212" text-anchor="middle" font-size="11" fill="#8a8a8a">中线不动</text>
    <path d="M470 134 L470 150" stroke="#30d158" stroke-width="0.9" opacity="0.6"/>
    <text x="466" y="130" font-size="11" fill="#30d158">内侧（高）</text>
    <text x="600" y="196" font-size="11" fill="#30d158">外侧（低）</text>
    <text x="550" y="236" text-anchor="middle" font-size="11" fill="#30d158">超高横坡 i_b，排水向内侧</text>

    <path d="M60 262 H600" stroke="#c8c8c8" stroke-width="0.9" stroke-dasharray="6 4" opacity="0.5"/>
    <text x="330" y="280" text-anchor="middle" font-size="11" fill="#8a8a8a">三段之间靠「超高缓和段」渐变，长度 Lc 由渐变率控制，取值须按现行 JTG D20 核对</text>
    <text x="330" y="296" text-anchor="middle" font-size="11" fill="#8a8a8a">旋转轴还有绕内边缘、绕外边缘两种做法，用哪种取决于教材与教师要求，别混用</text>
  </g>
</svg>
