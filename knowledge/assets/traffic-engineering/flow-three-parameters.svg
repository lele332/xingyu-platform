<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" role="img" aria-label="交通流三参数关系图：速度密度线性关系、流量密度抛物线、流量速度抛物线">
  <title>交通流三参数（Q = K · V）与 Greenshields 模型</title>
  <g font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#8a8a8a">
    <path d="M45 80 V240 H225" stroke="#c8c8c8" stroke-width="1"/>
    <path d="M50 90 L220 235" stroke="#0a84ff" stroke-width="2"/>
    <text x="30" y="96" font-size="11" fill="#0a84ff">v_f 自由流速度</text>
    <text x="212" y="256" font-size="11" fill="#0a84ff">k_j 阻塞密度</text>
    <text x="135" y="274" text-anchor="middle" font-size="11">V – K 关系（线性下降）</text>
    <text x="26" y="76" font-size="11">V</text>
    <text x="229" y="244" font-size="11">K</text>

    <path d="M270 80 V240 H450" stroke="#c8c8c8" stroke-width="1"/>
    <path d="M275 240 Q360 -20 445 240" fill="none" stroke="#30d158" stroke-width="2"/>
    <circle cx="360" cy="110" r="3.4" fill="#30d158"/>
    <path d="M360 110 V240" stroke="#c8c8c8" stroke-width="0.9" stroke-dasharray="4 3" opacity="0.7"/>
    <text x="368" y="112" font-size="11" fill="#30d158">Q_m 通行能力（最大流量）</text>
    <text x="360" y="256" font-size="11" fill="#30d158">k_m = k_j / 2</text>
    <text x="310" y="200" font-size="11" opacity="0.85">自由流</text>
    <text x="392" y="200" font-size="11" opacity="0.85">拥挤流</text>
    <text x="360" y="274" text-anchor="middle" font-size="11">Q – K 关系（抛物线）</text>
    <text x="252" y="76" font-size="11">Q</text>
    <text x="454" y="244" font-size="11">K</text>

    <path d="M495 80 V240 H645" stroke="#c8c8c8" stroke-width="1"/>
    <path d="M500 240 Q570 -20 640 240" fill="none" stroke="#bf5af2" stroke-width="2"/>
    <circle cx="570" cy="110" r="3.4" fill="#bf5af2"/>
    <path d="M570 110 V240" stroke="#c8c8c8" stroke-width="0.9" stroke-dasharray="4 3" opacity="0.7"/>
    <text x="566" y="256" font-size="11" fill="#bf5af2">v_m 临界车速</text>
    <text x="570" y="274" text-anchor="middle" font-size="11">Q – V 关系（抛物线）</text>
    <text x="478" y="76" font-size="11">Q</text>
    <text x="649" y="244" font-size="11">V</text>

    <text x="330" y="296" text-anchor="middle" font-size="11" fill="#8a8a8a">核心：Q = K · V；Greenshields 模型下 v = v_f(1 − K/k_j)，故 Q 在 K = k_j/2 处取最大值</text>
  </g>
</svg>
