<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" role="img" aria-label="净现值随折现率变化的曲线，与横轴交点为内部收益率">
  <title>NPV 曲线：与横轴的交点就是 IRR</title>
  <g font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#8a8a8a">
    <!-- 坐标轴 -->
    <path d="M60 40 V230 H620" stroke="#c8c8c8" stroke-width="1.4"/>
    <path d="M620 226 l-8 -4 l8 -4" fill="#c8c8c8" stroke="none"/>
    <path d="M60 36 l-4 8 l8 -4" fill="#c8c8c8" stroke="none"/>
    <text x="576" y="252" font-size="11.5">折现率 i</text>
    <text x="20" y="44" font-size="11.5">NPV</text>

    <!-- NPV 曲线：单调递减 -->
    <path d="M60 62 C 180 84, 250 140, 330 152 C 410 164, 500 196, 618 224"
          fill="none" stroke="#0a84ff" stroke-width="2.2"/>

    <!-- 横轴以上绿色段 / 以下红色段 的示意区域 -->
    <path d="M60 152 H330" stroke="#30d158" stroke-width="0.9" stroke-dasharray="4 4" opacity="0.55"/>
    <text x="90" y="146" font-size="11" fill="#30d158">NPV &gt; 0：可行</text>
    <text x="400" y="200" font-size="11" fill="#ff453a">NPV &lt; 0：不可行</text>

    <!-- IRR 交点 -->
    <circle cx="330" cy="152" r="5" fill="#ff9f0a"/>
    <path d="M330 152 V230" stroke="#ff9f0a" stroke-width="0.9" stroke-dasharray="4 4" opacity="0.8"/>
    <text x="340" y="140" fill="#ff9f0a">IRR（NPV = 0 时的折现率）</text>
    <text x="316" y="248" text-anchor="middle" fill="#ff9f0a">IRR</text>

    <!-- 基准收益率 i0 -->
    <path d="M200 40 V230" stroke="#bf5af2" stroke-width="1.1" stroke-dasharray="5 3"/>
    <circle cx="200" cy="112" r="4.5" fill="#bf5af2"/>
    <text x="150" y="266" fill="#bf5af2">i₀ 基准收益率</text>
    <path d="M200 112 H60" stroke="#bf5af2" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6"/>
    <text x="20" y="108" font-size="11" fill="#bf5af2">NPV(i₀)</text>

    <!-- 判据 -->
    <text x="24" y="26" font-size="11.5" fill="#8a8a8a">判据：IRR ≥ i₀ 等价于 NPV(i₀) ≥ 0 —— 两个指标说的是同一件事</text>
    <text x="24" y="286" font-size="11.5" fill="#8a8a8a">易错：互斥方案比选不能直接选 IRR 大的，必须用差额内部收益率（ΔIRR）或 NPV 最大</text>
  </g>
</svg>
