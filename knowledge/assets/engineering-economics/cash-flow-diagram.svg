<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" role="img" aria-label="现金流量图：投资、年净收益与残值在时间轴上的位置">
  <title>现金流量图：先支后收，箭头方向决定正负</title>
  <g font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#8a8a8a">
    <!-- 时间轴 -->
    <path d="M40 176 H630" stroke="#c8c8c8" stroke-width="1.4"/>
    <path d="M624 172 l8 4 l-8 4" fill="#c8c8c8" stroke="none"/>
    <text x="600" y="196" font-size="11.5">时间（年）</text>

    <!-- 刻度 -->
    <g stroke="#c8c8c8" stroke-width="1">
      <path d="M70 172 v8"/><path d="M163 172 v8"/><path d="M256 172 v8"/>
      <path d="M349 172 v8"/><path d="M442 172 v8"/><path d="M535 172 v8"/>
      <path d="M628 172 v8"/>
    </g>
    <g font-size="11.5" text-anchor="middle">
      <text x="70" y="194">0</text><text x="163" y="194">1</text><text x="256" y="194">2</text>
      <text x="349" y="194">3</text><text x="442" y="194">4</text><text x="535" y="194">5</text>
      <text x="628" y="194">n</text>
    </g>

    <!-- t=0：建设投资（流出，向下） -->
    <g stroke="#ff9f0a" stroke-width="1.8" fill="#ff9f0a">
      <path d="M70 176 V258"/>
      <path d="M64 252 l6 9 l6 -9"/>
    </g>
    <text x="80" y="252" fill="#ff9f0a">建设投资 P</text>
    <text x="80" y="268" font-size="11" fill="#ff9f0a">（现金流出，取负）</text>

    <!-- t=1..5：年净收益（流入，向上） -->
    <g stroke="#30d158" stroke-width="1.6" fill="#30d158">
      <path d="M163 176 V118"/><path d="M157 124 l6 -9 l6 9"/>
      <path d="M256 176 V118"/><path d="M250 124 l6 -9 l6 9"/>
      <path d="M349 176 V118"/><path d="M343 124 l6 -9 l6 9"/>
      <path d="M442 176 V118"/><path d="M436 124 l6 -9 l6 9"/>
      <path d="M535 176 V118"/><path d="M529 124 l6 -9 l6 9"/>
    </g>
    <path d="M163 118 H535" stroke="#30d158" stroke-width="0.9" stroke-dasharray="4 4" opacity="0.7"/>
    <text x="300" y="104" text-anchor="middle" fill="#30d158">等额年净收益 A（现金流入，取正）</text>

    <!-- t=n：残值（期末一次回收） -->
    <g stroke="#0a84ff" stroke-width="1.6" fill="#0a84ff" stroke-dasharray="5 3">
      <path d="M628 176 V96"/>
      <path d="M622 102 l6 -9 l6 9" stroke-dasharray="none"/>
    </g>
    <text x="560" y="84" fill="#0a84ff">期末残值 L</text>
    <text x="560" y="98" font-size="11" fill="#0a84ff">（也是流入，别漏）</text>

    <!-- 说明 -->
    <text x="24" y="26" font-size="11.5" fill="#8a8a8a">读图：向上＝钱进来（+），向下＝钱出去（−）；箭头长度示意金额大小，不按比例</text>
    <text x="24" y="292" font-size="11.5" fill="#8a8a8a">易错：收益发生在「年末」，投资发生在「期初（0 点）」，画错一格，折现就差一期</text>
  </g>
</svg>
