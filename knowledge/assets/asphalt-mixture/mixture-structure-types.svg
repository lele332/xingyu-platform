<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 290" width="660" height="290" role="img" aria-label="沥青混合料三种结构类型：悬浮密实结构、骨架空隙结构、骨架密实结构">
  <title>沥青混合料的三种结构类型（决定高温稳定性与耐久性的根本）</title>
  <g font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#8a8a8a">
    <text x="110" y="34" text-anchor="middle" fill="#0a84ff">悬浮－密实结构</text>
    <rect x="30" y="50" width="160" height="130" fill="#0a84ff" opacity="0.16" stroke="#c8c8c8" stroke-width="1.2"/>
    <circle cx="62" cy="78" r="13" fill="#d8d8d8" opacity="0.5" stroke="#c8c8c8" stroke-width="1.2"/>
    <circle cx="104" cy="98" r="13" fill="#d8d8d8" opacity="0.5" stroke="#c8c8c8" stroke-width="1.2"/>
    <circle cx="150" cy="76" r="13" fill="#d8d8d8" opacity="0.5" stroke="#c8c8c8" stroke-width="1.2"/>
    <circle cx="78" cy="138" r="13" fill="#d8d8d8" opacity="0.5" stroke="#c8c8c8" stroke-width="1.2"/>
    <circle cx="126" cy="146" r="13" fill="#d8d8d8" opacity="0.5" stroke="#c8c8c8" stroke-width="1.2"/>
    <circle cx="166" cy="122" r="13" fill="#d8d8d8" opacity="0.5" stroke="#c8c8c8" stroke-width="1.2"/>
    <text x="110" y="200" text-anchor="middle" font-size="11">粗集料互不接触，悬浮在沥青砂浆里</text>
    <text x="110" y="220" text-anchor="middle" font-size="11" fill="#0a84ff">代表：AC 密级配</text>
    <text x="110" y="240" text-anchor="middle" font-size="11">密实、耐久、水稳好</text>
    <text x="110" y="258" text-anchor="middle" font-size="11" fill="#ff9f0a">高温稳定性靠沥青黏度，易车辙</text>

    <text x="330" y="34" text-anchor="middle" fill="#ff9f0a">骨架－空隙结构</text>
    <rect x="250" y="50" width="160" height="130" fill="none" stroke="#c8c8c8" stroke-width="1.2" stroke-dasharray="4 3"/>
    <circle cx="278" cy="76" r="21" fill="#d8d8d8" opacity="0.45" stroke="#c8c8c8" stroke-width="1.4"/>
    <circle cx="318" cy="76" r="21" fill="#d8d8d8" opacity="0.45" stroke="#c8c8c8" stroke-width="1.4"/>
    <circle cx="358" cy="76" r="21" fill="#d8d8d8" opacity="0.45" stroke="#c8c8c8" stroke-width="1.4"/>
    <circle cx="298" cy="114" r="21" fill="#d8d8d8" opacity="0.45" stroke="#c8c8c8" stroke-width="1.4"/>
    <circle cx="338" cy="114" r="21" fill="#d8d8d8" opacity="0.45" stroke="#c8c8c8" stroke-width="1.4"/>
    <circle cx="316" cy="152" r="21" fill="#d8d8d8" opacity="0.45" stroke="#c8c8c8" stroke-width="1.4"/>
    <text x="330" y="200" text-anchor="middle" font-size="11">粗集料互相嵌挤成骨架，空隙未被填满</text>
    <text x="330" y="220" text-anchor="middle" font-size="11" fill="#ff9f0a">代表：AM、OGFC 排水路面</text>
    <text x="330" y="240" text-anchor="middle" font-size="11">抗滑、排水、降噪</text>
    <text x="330" y="258" text-anchor="middle" font-size="11" fill="#ff9f0a">空隙率大，易老化、水损</text>

    <text x="550" y="34" text-anchor="middle" fill="#30d158">骨架－密实结构</text>
    <rect x="470" y="50" width="160" height="130" fill="#30d158" opacity="0.16" stroke="#c8c8c8" stroke-width="1.2"/>
    <circle cx="498" cy="76" r="21" fill="#d8d8d8" opacity="0.55" stroke="#c8c8c8" stroke-width="1.4"/>
    <circle cx="538" cy="76" r="21" fill="#d8d8d8" opacity="0.55" stroke="#c8c8c8" stroke-width="1.4"/>
    <circle cx="578" cy="76" r="21" fill="#d8d8d8" opacity="0.55" stroke="#c8c8c8" stroke-width="1.4"/>
    <circle cx="518" cy="114" r="21" fill="#d8d8d8" opacity="0.55" stroke="#c8c8c8" stroke-width="1.4"/>
    <circle cx="558" cy="114" r="21" fill="#d8d8d8" opacity="0.55" stroke="#c8c8c8" stroke-width="1.4"/>
    <circle cx="536" cy="152" r="21" fill="#d8d8d8" opacity="0.55" stroke="#c8c8c8" stroke-width="1.4"/>
    <text x="550" y="200" text-anchor="middle" font-size="11">骨架嵌挤 ＋ 沥青玛蹄脂填满空隙</text>
    <text x="550" y="220" text-anchor="middle" font-size="11" fill="#30d158">代表：SMA 沥青玛蹄脂</text>
    <text x="550" y="240" text-anchor="middle" font-size="11">高温稳定与耐久兼顾</text>
    <text x="550" y="258" text-anchor="middle" font-size="11" fill="#30d158">需纤维稳定剂防析漏，造价较高</text>

    <text x="330" y="280" text-anchor="middle" font-size="11" fill="#8a8a8a">判断口诀：先看粗集料是否形成骨架，再看空隙有没有被填满——骨架决定抗车辙，密实决定耐久</text>
  </g>
</svg>
