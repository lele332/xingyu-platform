<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 280" width="660" height="280" role="img" aria-label="杠杆法计算荷载横向分布系数">
  <title>杠杆法：把桥面板当成一根撬棍</title>
  <g font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#8a8a8a">
    <!-- 主梁 1# / 2# -->
    <rect x="180" y="126" width="42" height="104" fill="#d8d8d8" opacity="0.12" stroke="#c8c8c8" stroke-width="1.4"/>
    <rect x="440" y="126" width="42" height="104" fill="#d8d8d8" opacity="0.12" stroke="#c8c8c8" stroke-width="1.4"/>
    <text x="188" y="248" font-size="11.5">1# 主梁</text>
    <text x="448" y="248" font-size="11.5">2# 主梁</text>

    <!-- 桥面板：简支在两梁上的"杠杆" -->
    <path d="M150 126 H512" stroke="#c8c8c8" stroke-width="1.4"/>
    <rect x="150" y="110" width="362" height="16" fill="#d8d8d8" opacity="0.10" stroke="#c8c8c8" stroke-width="1.4"/>
    <text x="320" y="122" text-anchor="middle" font-size="11">桥面板（视作一根撬棍，两端担在梁上）</text>

    <!-- 支点小三角 -->
    <path d="M196 126 l6 10 l6 -10 z" fill="#8a8a8a" opacity="0.8"/>
    <path d="M456 126 l6 10 l6 -10 z" fill="#8a8a8a" opacity="0.8"/>

    <!-- 车轮荷载 P -->
    <g stroke="#ff9f0a" stroke-width="1.6" fill="#ff9f0a">
      <path d="M300 48 V96"/>
      <path d="M294 92 l6 8 l6 -8"/>
    </g>
    <circle cx="300" cy="44" r="4" fill="#ff9f0a"/>
    <text x="312" y="52" fill="#ff9f0a">车轮荷载 P</text>

    <!-- 反力箭头 -->
    <g stroke="#0a84ff" stroke-width="1.6" fill="#0a84ff">
      <path d="M201 152 V196"/>
      <path d="M195 192 l6 8 l6 -8"/>
      <path d="M461 152 V196"/>
      <path d="M455 192 l6 8 l6 -8"/>
    </g>
    <text x="166" y="212" fill="#0a84ff">R₁ = P(b−e)/b</text>
    <text x="470" y="212" fill="#0a84ff">R₂ = P·e/b</text>

    <!-- 尺寸线 e -->
    <path d="M201 76 H300" stroke="#30d158" stroke-width="1.1"/>
    <path d="M201 72 v8 M300 72 v8" stroke="#30d158" stroke-width="1.1"/>
    <path d="M201 76 V106 M300 76 V106" stroke="#30d158" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.65"/>
    <text x="250" y="70" text-anchor="middle" fill="#30d158">e（荷载到 1# 梁的距离）</text>

    <!-- 尺寸线 b -->
    <path d="M201 262 H461" stroke="#bf5af2" stroke-width="1.1"/>
    <path d="M201 258 v8 M461 258 v8" stroke="#bf5af2" stroke-width="1.1"/>
    <text x="331" y="278" text-anchor="middle" fill="#bf5af2">b（两主梁中心距）</text>

    <!-- 适用条件 -->
    <text x="24" y="24" font-size="11.5" fill="#ff9f0a">适用：荷载靠近支点、或主梁间横向联系很弱（无横隔梁）时；计算主梁靠边一侧的分布系数</text>
  </g>
</svg>
