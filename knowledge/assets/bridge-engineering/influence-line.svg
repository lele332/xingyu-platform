<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 270" width="660" height="270" role="img" aria-label="简支梁某截面的弯矩影响线与最不利荷载布置">
  <title>影响线：先看形状，再决定把荷载摆在哪</title>
  <g font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#8a8a8a">
    <!-- 简支梁 -->
    <rect x="100" y="76" width="480" height="12" fill="#d8d8d8" opacity="0.14" stroke="#c8c8c8" stroke-width="1.3"/>
    <path d="M100 76 l14 16 l-14 0 z" fill="#8a8a8a" opacity="0.8"/>   <!-- 左铰支座 -->
    <circle cx="580" cy="94" r="5" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>  <!-- 右滚支座 -->
    <text x="86" y="112" font-size="11">A</text>
    <text x="580" y="112" font-size="11">B</text>

    <!-- C 截面 -->
    <path d="M280 76 V60" stroke="#0a84ff" stroke-width="1.2"/>
    <text x="272" y="56" fill="#0a84ff">C 截面</text>

    <!-- a / b 标注 -->
    <path d="M100 136 H280" stroke="#8a8a8a" stroke-width="0.9"/>
    <path d="M100 132 v8 M280 132 v8" stroke="#8a8a8a" stroke-width="0.9"/>
    <text x="190" y="130" text-anchor="middle" font-size="11">a</text>
    <path d="M280 136 H580" stroke="#8a8a8a" stroke-width="0.9"/>
    <text x="430" y="130" text-anchor="middle" font-size="11">b</text>

    <!-- 影响线：三角形 -->
    <path d="M100 200 L280 110 L580 200 Z" fill="#0a84ff" opacity="0.14"/>
    <path d="M100 200 L280 110 L580 200" fill="none" stroke="#0a84ff" stroke-width="1.8"/>
    <path d="M100 200 H580" stroke="#c8c8c8" stroke-width="1"/>
    <g stroke="#0a84ff" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6">
      <path d="M280 110 V200"/>
    </g>
    <text x="288" y="150" fill="#0a84ff">竖标 η = a·b / l</text>
    <text x="86" y="216" font-size="11" fill="#0a84ff">0</text>
    <text x="574" y="216" font-size="11" fill="#0a84ff">0</text>
    <text x="240" y="106" text-anchor="middle" fill="#0a84ff" font-size="11">最大值处（顶点正对 C 截面）</text>

    <!-- 最不利荷载布置 -->
    <g stroke="#ff9f0a" stroke-width="1.7" fill="#ff9f0a">
      <path d="M280 40 V64"/>
      <path d="M274 60 l6 8 l6 -8"/>
    </g>
    <text x="292" y="50" fill="#ff9f0a">集中荷载 P 摆在这里 → M_C 最大</text>

    <!-- 结论 -->
    <text x="24" y="240" font-size="13" fill="#0a84ff">M_C = P · η = P · a·b / l</text>
    <text x="24" y="260" font-size="11.5">口诀：影响线顶点在哪，荷载就压在哪；求什么量，就画什么量的影响线。</text>
  </g>
</svg>
