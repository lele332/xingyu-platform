<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 280" width="660" height="280" role="img" aria-label="T 形截面翼缘有效分布宽度示意：压应力沿翼缘宽度不均匀分布，折算为等效均匀受压宽度">
  <title>T 形截面的翼缘有效分布宽度 b′f</title>
  <g font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#8a8a8a">
    <path d="M150 78 Q240 44 330 42 Q420 44 510 78" fill="none" stroke="#ff9f0a" stroke-width="1.8"/>
    <path d="M190 68 V78 M230 56 V78 M270 49 V78 M310 45 V78 M350 45 V78 M390 49 V78 M430 56 V78 M470 68 V78"
          stroke="#ff9f0a" stroke-width="0.9" opacity="0.55"/>
    <text x="330" y="34" text-anchor="middle" font-size="11" fill="#ff9f0a">翼缘压应力沿宽度分布不均（肋部最大、向两侧衰减）</text>

    <rect x="150" y="80" width="360" height="34" fill="#d8d8d8" opacity="0.14" stroke="#c8c8c8" stroke-width="1.4"/>
    <rect x="285" y="114" width="90" height="116" fill="#d8d8d8" opacity="0.14" stroke="#c8c8c8" stroke-width="1.4"/>

    <circle cx="308" cy="212" r="5.5" fill="none" stroke="#c8c8c8" stroke-width="1.4"/>
    <circle cx="352" cy="212" r="5.5" fill="none" stroke="#c8c8c8" stroke-width="1.4"/>

    <path d="M180 132 H480" stroke="#30d158" stroke-width="1.2"/>
    <path d="M180 126 v12 M480 126 v12" stroke="#30d158" stroke-width="1.2"/>
    <text x="330" y="150" text-anchor="middle" font-size="11.5" fill="#30d158">b′f 翼缘有效分布宽度（计算取值）</text>

    <path d="M150 62 H510" stroke="#c8c8c8" stroke-width="1" opacity="0.7"/>
    <path d="M150 56 v12 M510 56 v12" stroke="#c8c8c8" stroke-width="1" opacity="0.7"/>
    <text x="330" y="50" font-size="0" fill="none">x</text>
    <text x="512" y="60" font-size="11" fill="#8a8a8a">bf 实际翼缘宽</text>

    <path d="M285 248 H375" stroke="#0a84ff" stroke-width="1.2"/>
    <path d="M285 242 v12 M375 242 v12" stroke="#0a84ff" stroke-width="1.2"/>
    <text x="330" y="266" text-anchor="middle" font-size="11.5" fill="#0a84ff">b 肋宽</text>

    <text x="120" y="100" font-size="11">h′f 翼缘厚</text>
    <path d="M140 84 V112" stroke="#c8c8c8" stroke-width="1"/>
    <path d="M135 84 h10 M135 112 h10" stroke="#c8c8c8" stroke-width="1"/>

    <text x="330" y="278" text-anchor="middle" font-size="11" fill="#8a8a8a">易错：直接拿实际翼缘宽 bf 当 b′f 用会高估承载力；b′f 取值与计算跨径、翼缘厚、相邻梁净距有关，按现行规范核对</text>
  </g>
</svg>
