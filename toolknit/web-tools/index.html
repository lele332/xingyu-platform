<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星屿 · 网页版多媒体工坊</title>
<style>
  :root{
    --bg:#0b0e1a; --panel:rgba(255,255,255,.045); --line:rgba(255,255,255,.09);
    --txt:#e8ecf5; --dim:#8b93a7; --acc:#4cc9ff; --acc2:#9b6bff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(155,107,255,.16), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(76,201,255,.14), transparent 60%),
      var(--bg);
    color:var(--txt); min-height:100vh; padding:26px clamp(14px,4vw,44px) 60px;
  }
  .wrap{max-width:860px;margin:0 auto}
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .back{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--txt);cursor:pointer;font-size:13px;transition:.2s}
  .back:hover{border-color:var(--acc);box-shadow:0 0 0 3px rgba(76,201,255,.12)}
  h1{font-size:22px;font-weight:700;letter-spacing:.5px}
  .sub{width:100%;color:var(--dim);font-size:13px;margin-top:-6px}
  .sub b{color:var(--acc);font-weight:600}
  .modes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .modes button{padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--dim);cursor:pointer;font-size:13px;transition:.2s}
  .modes button:hover{color:var(--txt)}
  .modes button.active{color:#fff;background:linear-gradient(135deg,rgba(76,201,255,.22),rgba(155,107,255,.22));border-color:rgba(76,201,255,.5);box-shadow:0 0 0 3px rgba(76,201,255,.08)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}
  .dz{border:1.5px dashed rgba(255,255,255,.16);border-radius:16px;padding:34px 20px;text-align:center;cursor:pointer;transition:.2s}
  .dz:hover,.dz.over{border-color:var(--acc);background:rgba(76,201,255,.05)}
  .dz .dz-ic{font-size:34px;margin-bottom:10px}
  .dz p{color:var(--dim);font-size:14px}
  .dz p b{color:var(--txt);font-weight:600}
  .dz .dz-hint{font-size:12px;margin-top:8px;color:rgba(139,147,167,.7)}
  .files{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .file{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:13px}
  .file .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .file .sz{color:var(--dim);font-size:12px}
  .file .rm{background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px;line-height:1}
  .file .rm:hover{color:#ff6b6b}
  .opts{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;align-items:flex-end}
  .opt{display:flex;flex-direction:column;gap:6px}
  .opt label{font-size:12px;color:var(--dim)}
  .opt select,.opt input[type=number]{background:#0f1322;border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:8px 10px;font-size:13px;min-width:120px}
  .opt input[type=range]{width:150px;accent-color:var(--acc)}
  .opt-row{flex-direction:row!important;align-items:center!important;gap:10px}
  .runbar{display:flex;align-items:center;gap:16px;margin-top:20px;flex-wrap:wrap}
  .run{padding:11px 26px;border-radius:12px;border:none;cursor:pointer;font-size:15px;font-weight:600;color:#fff;background:linear-gradient(135deg,#2fb6ff,#8a5cf6);transition:.2s}
  .run:hover{filter:brightness(1.1)}
  .run:disabled{opacity:.4;cursor:not-allowed;filter:none}
  .progress{flex:1;min-width:180px;display:flex;align-items:center;gap:10px}
  .track{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
  .fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#2fb6ff,#8a5cf6);transition:width .15s}
  .pct{font-size:12px;color:var(--acc);min-width:34px;text-align:right}
  .status{font-size:12px;color:var(--dim);margin-top:10px}
  .results{margin-top:18px;display:flex;flex-direction:column;gap:10px}
  .res{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:rgba(46,204,113,.07);border:1px solid rgba(46,204,113,.25);font-size:13px}
  .res .ok{color:#2ecc71;font-weight:600}
  .res .rnm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .res a{padding:6px 14px;border-radius:9px;text-decoration:none;font-weight:600;font-size:12px;background:#2ecc71;color:#04120a}
  .res a:hover{filter:brightness(1.1)}
  .err{padding:12px 14px;border-radius:12px;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.3);color:#ff8f8f;font-size:13px;margin-top:14px}
  .boot{text-align:center;color:var(--dim);padding:30px;font-size:14px}
  .boot .spi{display:inline-block;width:22px;height:22px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-5px;margin-right:10px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="back" id="backBtn">← 返回工具箱</button>
    <h1>网页版多媒体工坊</h1>
    <p class="sub">基于 <b>ffmpeg.wasm</b> 在浏览器本地处理，文件不会上传到服务器</p>
  </header>
  <nav class="modes" id="modes"></nav>
  <div class="panel">
    <div class="boot" id="boot"><span class="spi"></span>正在加载 ffmpeg 引擎（首次约需几秒，含 32MB 运行库）…</div>
    <div id="workspace" class="hidden">
      <div class="dz" id="dz">
        <div class="dz-ic">📁</div>
        <p>拖拽文件到此处，或点击 <b>选择文件</b></p>
        <p class="dz-hint" id="dzHint"></p>
      </div>
      <div class="files" id="fileList"></div>
      <div class="opts" id="opts"></div>
      <div class="runbar">
        <button class="run" id="runBtn" disabled>开始处理</button>
        <div class="progress hidden" id="progressWrap">
          <div class="track"><div class="fill" id="progressFill"></div></div>
          <span class="pct" id="progressText">0%</span>
        </div>
      </div>
      <div class="status hidden" id="status"></div>
      <div class="results" id="results"></div>
    </div>
  </div>
</div>

<script type="module">
import { FFmpeg } from './ffmpeg/ffmpeg/classes.js';
import { toBlobURL, fetchFile } from './ffmpeg/util/index.js';
const $=id=>document.getElementById(id);
const fileInput=document.createElement('input'); fileInput.type='file'; fileInput.style.display='none'; document.body.appendChild(fileInput);

const MODES={
  videoConvert:{ label:'视频转换', icon:'🎬', accept:'video/*,.mp4,.avi,.mkv,.mov,.webm,.flv,.wmv,.ts,.m4v', multiple:true,
    hint:'支持 MP4 / AVI / MKV / MOV / WebM / FLV / WMV / TS / M4V',
    options:[{type:'select',key:'format',label:'目标格式',choices:['mp4','avi','mkv','mov','webm','flv','wmv','ts','m4v']}],
    build:(f,o)=>['-i',f,...codec.video(o.format)] },
  audioConvert:{ label:'音频转换', icon:'🎵', accept:'audio/*,.mp3,.wav,.flac,.aac,.m4a,.ogg,.opus,.wma,.mp4', multiple:true,
    hint:'支持 MP3 / WAV / FLAC / AAC / M4A / OGG / Opus / WMA',
    options:[{type:'select',key:'format',label:'目标格式',choices:['mp3','wav','flac','aac','m4a','ogg','opus','wma']}],
    build:(f,o)=>['-i',f,...codec.audio[o.format]] },
  imageConvert:{ label:'图片转换', icon:'🖼️', accept:'image/*,.jpg,.jpeg,.png,.webp,.bmp,.tiff,.gif', multiple:true,
    hint:'支持 JPG / PNG / WebP / BMP / TIFF',
    options:[{type:'select',key:'format',label:'目标格式',choices:['jpg','png','webp','bmp','tiff']}],
    build:(f,o)=>{ const a=['-i',f]; if(o.format==='jpg')a.push('-q:v','2'); if(o.format==='webp')a.push('-quality','82'); return a; } },
  imageCompress:{ label:'图片压缩', icon:'🗜️', accept:'image/*,.jpg,.jpeg,.png,.webp,.bmp,.tiff', multiple:true,
    hint:'压缩 JPG / PNG / WebP，可选输出格式与质量',
    options:[
      {type:'select',key:'format',label:'输出格式',choices:['webp','jpg','png']},
      {type:'range',key:'quality',label:'压缩质量',min:5,max:100,step:5,value:60},
    ],
    build:(f,o)=>{ const a=['-i',f]; const q=+o.quality;
      if(o.format==='webp')a.push('-quality',String(q));
      else if(o.format==='jpg')a.push('-q:v',String(Math.round((100-q)/100*30+1)));
      else if(o.format==='png')a.push('-compression_level','9');
      return a; } },
  audioExtract:{ label:'音频提取', icon:'🎚️', accept:'video/*,.mp4,.avi,.mkv,.mov,.webm,.flv,.wmv,.ts,.m4v', multiple:false,
    hint:'从视频中提取音轨（MP4 / AVI / MKV / MOV / WebM 等）',
    options:[{type:'select',key:'format',label:'输出格式',choices:['mp3','wav','flac','aac','m4a','ogg','opus']}],
    build:(f,o)=>['-i',f,'-vn',...codec.audio[o.format]] },
  audioClip:{ label:'音频剪辑', icon:'✂️', accept:'audio/*,video/*,.mp3,.wav,.flac,.m4a,.aac,.ogg,.opus,.mp4', multiple:false,
    hint:'截取音频片段：输入起止秒数',
    options:[
      {type:'number',key:'start',label:'开始（秒）',value:0,min:0,step:0.5},
      {type:'number',key:'end',label:'结束（秒）',value:10,min:0,step:0.5},
      {type:'select',key:'format',label:'输出格式',choices:['mp3','wav','flac','m4a','ogg','opus']},
    ],
    build:(f,o)=>['-ss',String(o.start),'-i',f,'-to',String(Math.max(0.1,o.end-o.start)),...codec.audio[o.format]] },
  videoFrame:{ label:'视频取帧', icon:'📸', accept:'video/*,.mp4,.avi,.mkv,.mov,.webm,.flv,.wmv,.ts,.m4v', multiple:false,
    hint:'在指定时间点截取一帧高清图片',
    options:[
      {type:'number',key:'time',label:'时间点（秒）',value:1,min:0,step:0.1},
      {type:'select',key:'format',label:'输出格式',choices:['png','jpg','webp']},
    ],
    build:(f,o)=>['-ss',String(o.time),'-i',f,'-frames:v','1','-q:v','2','-update','1'] },
  videoGif:{ label:'视频转GIF', icon:'🎞️', accept:'video/*,.mp4,.avi,.mkv,.mov,.webm,.flv,.wmv,.ts,.m4v', multiple:false, outExt:()=> 'gif',
    hint:'截取视频片段转成 GIF（建议 30 秒内）',
    options:[
      {type:'number',key:'start',label:'开始（秒）',value:0,min:0,step:0.5},
      {type:'number',key:'end',label:'结束（秒）',value:5,min:0.5,step:0.5},
      {type:'number',key:'fps',label:'帧率',value:10,min:5,max:25,step:1},
      {type:'number',key:'width',label:'宽度(px)',value:320,min:120,max:800,step:10},
    ],
    build:(f,o)=>['-ss',String(o.start),'-i',f,'-t',String(Math.max(0.5,o.end-o.start)),'-vf','fps='+(+o.fps)+',scale='+(+o.width)+':-1:flags=lanczos','-loop','0'] }
};

const codec={
  video(fmt){
    switch(fmt){
      case 'mp4': return ['-c:v','libx264','-preset','medium','-pix_fmt','yuv420p','-c:a','aac','-movflags','+faststart'];
      case 'avi': return ['-c:v','mpeg4','-q:v','5','-c:a','libmp3lame'];
      case 'mkv': return ['-c:v','libx264','-preset','medium','-pix_fmt','yuv420p','-c:a','aac'];
      case 'mov': return ['-c:v','libx264','-preset','medium','-pix_fmt','yuv420p','-c:a','aac'];
      case 'webm': return ['-c:v','libvpx-vp9','-b:v','0','-cpu-used','4','-c:a','libopus'];
      case 'flv': return ['-c:v','flv','-c:a','libmp3lame'];
      case 'wmv': return ['-c:v','wmv2','-c:a','wmav2'];
      case 'ts': return ['-c:v','libx264','-preset','medium','-pix_fmt','yuv420p','-c:a','aac','-f','mpegts'];
      case 'm4v': return ['-c:v','libx264','-preset','medium','-pix_fmt','yuv420p','-c:a','aac'];
      default: return [];
    }
  },
  audio:{ mp3:['-c:a','libmp3lame','-q:a','2'], wav:['-c:a','pcm_s16le'], flac:['-c:a','flac'],
    aac:['-c:a','aac','-b:a','192k'], m4a:['-c:a','aac','-b:a','192k'], ogg:['-c:a','libvorbis','-q:a','5'],
    opus:['-c:a','libopus'], wma:['-c:a','wmav2','-b:a','192k'] },
};

let mode='videoConvert', ffmpeg=null, ffmpegReady=false, ffmpegLoading=false;
let files=[];
const results=[];

Object.keys(MODES).forEach(k=>{
  const b=document.createElement('button'); b.textContent=MODES[k].label; b.dataset.mode=k;
  b.addEventListener('click',()=>setMode(k)); $('modes').appendChild(b);
});

function setMode(k){
  mode=k; files=[]; results.length=0;
  document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('active',b.dataset.mode===k));
  $('dzHint').textContent=MODES[k].hint;
  fileInput.multiple=MODES[k].multiple; fileInput.accept=MODES[k].accept;
  renderOpts(); renderFiles(); renderResults(); updateRun();
}
function renderOpts(){
  const o=$('opts'); o.innerHTML='';
  MODES[mode].options.forEach(opt=>{
    const wrap=document.createElement('div'); wrap.className='opt';
    const lab=document.createElement('label'); lab.textContent=opt.label; wrap.appendChild(lab);
    let el;
    if(opt.type==='select'){ el=document.createElement('select'); opt.choices.forEach(c=>{const oo=document.createElement('option');oo.value=c;oo.textContent=c.toUpperCase();el.appendChild(oo);}); }
    else if(opt.type==='range'){
      el=document.createElement('input'); el.type='range'; el.min=opt.min; el.max=opt.max; el.step=opt.step; el.value=opt.value;
      const val=document.createElement('label'); val.textContent=opt.value; val.style.minWidth='30px';
      el.addEventListener('input',()=>val.textContent=el.value);
      wrap.classList.add('opt-row'); wrap.appendChild(el); wrap.appendChild(val);
    } else if(opt.type==='text'||opt.type==='password'){ el=document.createElement('input'); el.type=opt.type; el.value=opt.value??''; if(opt.type==='password')el.style.minWidth='150px'; }
    else { el=document.createElement('input'); el.type='number'; el.min=opt.min??0; el.step=opt.step??1; el.value=opt.value??0; }
    el.dataset.key=opt.key; wrap.appendChild(el); o.appendChild(wrap);
  });
}
function readOpts(){
  const out={};
  document.querySelectorAll('#opts .opt').forEach(w=>{
    const el=w.querySelector('[data-key]');
    if(el) out[el.dataset.key]= el.type==='number'?parseFloat(el.value)||0 : (el.type==='range'?parseInt(el.value,10):el.value);
  });
  return out;
}
function addFiles(list){
  const cfg=MODES[mode];
  if(!cfg.multiple){ files=[list[0]]; }
  else{ for(const f of list){ if(!files.some(x=>x.name===f.name&&x.size===f.size)) files.push(f); } }
  renderFiles(); updateRun();
}
function renderFiles(){
  const fl=$('fileList'); fl.innerHTML='';
  files.forEach((f,i)=>{
    const d=document.createElement('div'); d.className='file';
    const nm=document.createElement('span'); nm.className='nm'; nm.textContent=f.name;
    const sz=document.createElement('span'); sz.className='sz'; sz.textContent=fmtSize(f.size);
    const rm=document.createElement('button'); rm.className='rm'; rm.textContent='✕';
    rm.addEventListener('click',()=>{ files.splice(i,1); renderFiles(); updateRun(); });
    d.appendChild(nm); d.appendChild(sz); d.appendChild(rm); fl.appendChild(d);
  });
}
function fmtSize(b){ if(b>1048576)return (b/1048576).toFixed(1)+' MB'; if(b>1024)return (b/1024).toFixed(1)+' KB'; return b+' B'; }
async function runPdf(file, opts){
  const bytes=await file.arrayBuffer();
  const doc=await window.PDFLib.PDFDocument.load(bytes,{ password: opts.password||'' });
  const out=await doc.save();
  const name=stripExt(file.name)+'_解密.pdf';
  results.push(makeResultLink(name, new Uint8Array(out))); renderResults();
}
async function ensureFfmpeg(){
  if(ffmpegReady) return ffmpeg;
  if(ffmpegLoading){ while(!ffmpegReady) await new Promise(r=>setTimeout(r,80)); return ffmpeg; }
  ffmpegLoading=true;
  ffmpeg=new FFmpeg();
  ffmpeg.on('progress',({progress})=>{ updateProgress(Math.max(0,Math.min(1,progress))); });
  await ffmpeg.load({ coreURL: await toBlobURL('./ffmpeg/core/ffmpeg-core.js','text/javascript'), wasmURL: await toBlobURL('./ffmpeg/core/ffmpeg-core.wasm','application/wasm') });
  ffmpeg.on('log',({message})=>{ $('status').classList.remove('hidden'); $('status').textContent=message; });
  ffmpegReady=true; ffmpegLoading=false;
  $('boot').classList.add('hidden'); $('workspace').classList.remove('hidden');
  return ffmpeg;
}
function updateProgress(p){ $('progressFill').style.width=(p*100).toFixed(1)+'%'; $('progressText').textContent=Math.round(p*100)+'%'; }
function setStatus(t){ const s=$('status'); s.textContent=t; s.classList.remove('hidden'); }
function renderResults(){ const r=$('results'); r.innerHTML=''; results.forEach(x=>r.appendChild(x)); }
function makeResultLink(name,data){
  const url=URL.createObjectURL(new Blob([data]));
  const d=document.createElement('div'); d.className='res';
  const ok=document.createElement('span'); ok.className='ok'; ok.textContent='✓';
  const nm=document.createElement('span'); nm.className='rnm'; nm.textContent=name+' ('+fmtSize(data.length)+')';
  const a=document.createElement('a'); a.href=url; a.download=name; a.textContent='下载';
  d.appendChild(ok); d.appendChild(nm); d.appendChild(a); return d;
}
function updateRun(){ var cfg=MODES[mode]; $('runBtn').disabled = files.length===0 || (!cfg.noFfmpeg && !ffmpegReady); }
function outExt(cfg,opts){ return cfg.outExt?cfg.outExt(opts):(opts.format||'out'); }
function extOf(n){ const i=n.lastIndexOf('.'); return i>0?n.slice(i+1):'bin'; }
function stripExt(n){ const i=n.lastIndexOf('.'); return i>0?n.slice(0,i):n; }

async function run(){
  if(!files.length) return;
  const cfg=MODES[mode]; const opts=readOpts();
  const runBtn=$('runBtn'); runBtn.disabled=true;
  $('progressWrap').classList.remove('hidden'); updateProgress(0);
  results.length=0; renderResults();
  try{
    if(cfg.noFfmpeg){
      await runPdf(files[0], opts);
    } else {
      const f=await ensureFfmpeg();
      for(let i=0;i<files.length;i++){
      const file=files[i];
      const inName='in_'+i+'.'+extOf(file.name);
      const outName=stripExt(file.name)+'.'+outExt(cfg,opts);
      setStatus('正在处理「'+file.name+'」…');
      await f.writeFile(inName, await fetchFile(file));
      const cmd=cfg.build(inName,opts,file); cmd.push(outName);
      await f.exec(cmd);
      const data=await f.readFile(outName);
      results.push(makeResultLink(outName,data)); renderResults();
      try{ await f.deleteFile(inName); await f.deleteFile(outName);}catch(e){}
      updateProgress((i+1)/files.length);
      }
    }
    setStatus('✅ 全部完成！');
  }catch(e){
    setStatus('❌ 处理失败');
    const d=document.createElement('div'); d.className='err';
    d.textContent='处理 "'+files[0].name+'" 时出错：'+(e&&e.message?e.message:e);
    $('results').appendChild(d);
  }finally{
    $('progressWrap').classList.add('hidden'); updateRun();
  }
}

$('dz').addEventListener('click',()=>{ fileInput.multiple=MODES[mode].multiple; fileInput.accept=MODES[mode].accept; fileInput.click(); });
fileInput.addEventListener('change',()=>{ if(fileInput.files.length) addFiles(Array.from(fileInput.files)); fileInput.value=''; });
['dragover','dragenter'].forEach(ev=>$('dz').addEventListener(ev,e=>{e.preventDefault();$('dz').classList.add('over');}));
['dragleave','drop'].forEach(ev=>$('dz').addEventListener(ev,e=>{e.preventDefault();$('dz').classList.remove('over');}));
$('dz').addEventListener('drop',e=>{ if(e.dataTransfer.files.length) addFiles(Array.from(e.dataTransfer.files)); });
$('runBtn').addEventListener('click',run);
$('backBtn').addEventListener('click',()=>{ history.back(); });

var _p=new URLSearchParams(location.search).get('tool'); setMode(MODES[_p]?_p:'videoConvert'); ensureFfmpeg();
</script>
</body>
</html>
