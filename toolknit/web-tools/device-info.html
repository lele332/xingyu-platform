<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星屿 · 本机设备信息</title>
<style>
  :root{--bg:#0b0e1a;--panel:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);--txt:#e8ecf5;--dim:#8b93a7;--acc:#4cc9ff;--acc2:#9b6bff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:radial-gradient(1100px 550px at 85% -10%,rgba(155,107,255,.14),transparent 60%),radial-gradient(850px 480px at -10% 110%,rgba(76,201,255,.12),transparent 60%),var(--bg);color:var(--txt);min-height:100vh;padding:26px clamp(14px,4vw,44px) 60px}
  .wrap{max-width:820px;margin:0 auto}
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .back{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--txt);cursor:pointer;font-size:13px;transition:.2s}
  .back:hover{border-color:var(--acc)}
  h1{font-size:22px;font-weight:700}
  .note{width:100%;color:var(--dim);font-size:12.5px;background:rgba(255,193,7,.08);border:1px solid rgba(255,193,7,.25);border-radius:10px;padding:9px 12px;margin-top:4px}
  .note b{color:#ffd66b}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .tabs button{padding:8px 13px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--dim);cursor:pointer;font-size:13px;transition:.2s}
  .tabs button:hover{color:var(--txt)}
  .tabs button.active{color:#fff;background:linear-gradient(135deg,rgba(76,201,255,.22),rgba(155,107,255,.22));border-color:rgba(76,201,255,.5)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
  .card h2{font-size:16px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .rows{display:flex;flex-direction:column;gap:8px}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);font-size:13px}
  .row .k{color:var(--dim);flex-shrink:0}
  .row .v{text-align:right;word-break:break-all}
  .grp{font-size:12px;color:var(--acc);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.5px}
  .unav{padding:14px;border-radius:10px;background:rgba(255,107,107,.07);border:1px solid rgba(255,107,107,.25);color:#ffb4b4;font-size:13px;line-height:1.6}
  .load{color:var(--dim);padding:20px;text-align:center;font-size:14px}
  .load .spi{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-4px;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media(max-width:520px){.row{flex-direction:column;gap:4px}.row .v{text-align:left}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="back" id="backBtn">← 返回工具箱</button>
    <h1>本机设备信息</h1>
    <div class="note" id="note">正在连接本机原生服务…</div>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="card"><div class="load" id="content"><span class="spi"></span>加载中…</div></div>
</div>
<script>
const API='http://127.0.0.1:8621';
const SEC=[
  {id:'overview',label:'整机概览'},
  {id:'cpu',label:'CPU与内存'},
  {id:'gpu',label:'显卡与显示器'},
  {id:'mainboard',label:'主板与固件'},
  {id:'storage',label:'磁盘与健康'},
  {id:'network',label:'网络与设备'},
  {id:'power',label:'电源与传感器'},
];
let backendOk=false;
const tabs=document.getElementById('tabs'), content=document.getElementById('content');
SEC.forEach(s=>{const b=document.createElement('button');b.textContent=s.label;b.dataset.id=s.id;b.onclick=()=>show(s.id);tabs.appendChild(b);});

function fmtSize(b){ b=parseFloat(b)||0; if(b>=1099511627776)return (b/1099511627776).toFixed(2)+' TB'; if(b>=1073741824)return (b/1073741824).toFixed(2)+' GB'; if(b>=1048576)return (b/1048576).toFixed(1)+' MB'; return b+' B'; }
function esc(s){ return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function row(k,v){ return '<div class="row"><span class="k">'+esc(k)+'</span><span class="v">'+esc(v)+'</span></div>'; }
function grp(t){ return t?'<div class="grp">'+esc(t)+'</div>':''; }

function renderOverview(d){
  let h='';
  h+=grp('操作系统')+row('系统',d.os&&d.os.caption)+row('版本',d.os&&d.os.version)+row('架构',d.os&&d.os.osarchitecture);
  h+=grp('整机')+row('厂商',d.system&&d.system.manufacturer)+row('型号',d.system&&d.system.model);
  h+=grp('BIOS')+row('厂商',d.bios&&d.bios.manufacturer)+row('版本',d.bios&&d.bios.smbiosbiosversion);
  h+=grp('环境')+row('主机名',d.python&&d.python.hostname)+row('平台',d.python&&d.python.platform);
  return h;
}
function renderSimple(data, maps){
  let h='';
  const list=data&&data[0]?data:[data];
  list.forEach((item,i)=>{
    if(maps.length>1) h+=grp('设备 '+(i+1));
    for(const [k,label,fmt] of maps){ if(item&&item[k]) h+=row(label, fmt?fmt(item[k]):item[k]); }
  });
  return h;
}

async function show(id){
  SEC.forEach(b=>{const el=document.querySelector('#tabs button[data-id="'+id+'"]');});
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
  content.innerHTML='<div class="load"><span class="spi"></span>读取中…</div>';
  if(!backendOk){
    content.innerHTML='<div class="unav">本机原生服务未启动。请完全退出并重新打开「星屿」桌面图标（这会自动启动原生服务）。</div>';
    return;
  }
  try{
    const r=await fetch(API+'/hardware?section='+id); const d=await r.json();
    let h='';
    if(id==='overview') h=renderOverview(d);
    else if(id==='cpu'){
      h=renderSimple(d.cpu_list,[['Name','CPU 型号'],['NumberOfCores','物理核心'],['NumberOfLogicalProcessors','逻辑线程'],['MaxClockSpeed','最高频率（MHz）']]);
      h+=grp('内存')+row('总物理内存',fmtSize(d.total_memory));
    }
    else if(id==='gpu') h=renderSimple(d.gpu_list,[['Name','显卡'],['AdapterRAM','显存',fmtSize],['DriverVersion','驱动版本']]);
    else if(id==='mainboard') h=renderSimple(d.baseboard,[['Manufacturer','主板厂商'],['Product','主板型号'],['Version','版本']])+grp('BIOS')+renderSimple(d.bios,[['Name','BIOS 名称'],['Version','版本']]);
    else if(id==='storage') h=renderSimple(d.disks,[['Model','磁盘型号'],['Size','容量',fmtSize],['MediaType','介质类型'],['InterfaceType','接口']]);
    else if(id==='network') h=renderSimple(d.nics,[['Name','网卡'],['MACAddress','MAC 地址'],['Speed','连接速率']]).replace(/Speed/g,'Speed')+(!d.nics||!d.nics.length?row('网卡','未检测到活动网卡'):'');
    else if(id==='power') h=renderSimple(d.battery,[['EstimatedChargeRemaining','当前电量 %'],['BatteryStatus','电池状态'],['EstimatedRunTime','剩余分钟']])+(!d.battery||!d.battery.length?row('电池','未检测到笔记本电池'):'');
    content.innerHTML='<div class="rows">'+h+'</div>';
  }catch(e){
    content.innerHTML='<div class="unav">读取失败：'+esc(e.message||e)+'</div>';
  }
}

async function init(){
  try{
    const r=await fetch(API+'/health'); const j=await r.json();
    backendOk = j.status==='ok';
    document.getElementById('note').textContent = backendOk ? '已连接本机原生服务，可读取真实硬件信息。' : '本机原生服务未启动。';
    document.getElementById('note').style.borderColor = backendOk ? 'rgba(46,204,113,.4)' : 'rgba(255,193,7,.25)';
  }catch(e){ backendOk=false; document.getElementById('note').textContent='本机原生服务未启动。'; }
  const p=new URLSearchParams(location.search).get('section');
  show(!p?'overview':(SEC.find(s=>s.id===p)?p:'overview'));
}
document.getElementById('backBtn').addEventListener('click',()=>history.back());
init();
</script>
</body>
</html>
