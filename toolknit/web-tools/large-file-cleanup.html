<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星屿 · 大文件清理</title>
<style>
  :root{--bg:#0b0e1a;--panel:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);--txt:#e8ecf5;--dim:#8b93a7;--acc:#4cc9ff;--acc2:#9b6bff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:radial-gradient(1100px 550px at 85% -10%,rgba(155,107,255,.14),transparent 60%),radial-gradient(850px 480px at -10% 110%,rgba(76,201,255,.12),transparent 60%),var(--bg);color:var(--txt);min-height:100vh;padding:26px clamp(14px,4vw,44px) 60px}
  .wrap{max-width:860px;margin:0 auto}
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .back{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--txt);cursor:pointer;font-size:13px;transition:.2s}
  .back:hover{border-color:var(--acc)}
  h1{font-size:22px;font-weight:700}
  .note{width:100%;color:var(--dim);font-size:12.5px;background:rgba(255,193,7,.08);border:1px solid rgba(255,193,7,.25);border-radius:10px;padding:9px 12px;margin-top:4px}
  .note.ok{border-color:rgba(46,204,113,.4);background:rgba(46,204,113,.07)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
  .cfg{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;color:var(--dim)}
  .field input,.field select{background:#0f1322;border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px 12px;font-size:13px}
  .field input[type=text]{min-width:260px}
  .field input[type=number]{min-width:110px}
  .run{padding:11px 26px;border-radius:12px;border:none;cursor:pointer;font-size:14px;font-weight:600;color:#fff;background:linear-gradient(135deg,#2fb6ff,#8a5cf6);transition:.2s}
  .run:hover{filter:brightness(1.1)}
  .run:disabled{opacity:.4;cursor:not-allowed;filter:none}
  .status{font-size:12.5px;color:var(--dim);margin-top:14px;line-height:1.6}
  .err{margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.3);color:#ff8f8f;font-size:13px;display:none}
  .list{margin-top:16px;display:none}
  .list.show{display:block}
  .list-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;color:var(--dim)}
  .list-h b{color:var(--acc)}
  .rows{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto}
  .row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line);font-size:13px}
  .row .sz{flex-shrink:0;font-weight:600;color:#ffd66b;min-width:80px;text-align:right}
  .row .path{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
  .empty{padding:20px;text-align:center;color:var(--dim);font-size:13px;border:1px dashed var(--line);border-radius:12px}
  .hint{font-size:12px;color:var(--dim);margin-top:14px;line-height:1.7}
  .spinner{display:inline-block;width:16px;height:16px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="back" id="backBtn">← 返回工具箱</button>
    <h1>AI 大文件清理</h1>
    <div class="note" id="note">正在连接本机原生服务…</div>
  </header>
  <div class="panel">
    <div class="cfg">
      <div class="field">
        <label for="root">扫描位置（盘符或文件夹）</label>
        <input id="root" type="text" value="C:\" placeholder="例如 C:\ 或 D:\Users\downloads">
      </div>
      <div class="field">
        <label for="minMB">大小阈值</label>
        <input id="minMB" type="number" value="100" min="10" step="10">
      </div>
      <button class="run" id="runBtn" disabled>扫描大文件</button>
    </div>
    <div class="status" id="status">扫描会在本机完成，跳过系统目录以加快速度。</div>
    <div class="err" id="err"></div>
    <div class="list" id="list">
      <div class="list-h">共找到 <b id="count">0</b> 个文件（> 阈值）</div>
      <div class="rows" id="rows"></div>
    </div>
    <div class="hint">提示：扫描结果仅用于定位占用空间较大的文件，是否删除由你自行决定。请务必确认文件不再需要后再清理。</div>
  </div>
</div>
<script>
const API=location.protocol+"//"+location.hostname+":8621";
let backendOk=false;
const $=id=>document.getElementById(id);
function fmtSize(b){ b=parseFloat(b)||0; if(b>=1099511627776)return (b/1099511627776).toFixed(2)+" TB"; if(b>=1073741824)return (b/1073741824).toFixed(2)+" GB"; if(b>=1048576)return (b/1048576).toFixed(1)+" MB"; if(b>=1024)return (b/1024).toFixed(1)+" KB"; return b+" B"; }
function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function setNote(ok, txt){ const n=$("note"); n.textContent=txt; n.classList.toggle("ok",ok); }
function showErr(m){ const e=$("err"); e.textContent=m; e.style.display="block"; }
function upRun(){ $("runBtn").disabled = !backendOk; }
$("runBtn").addEventListener("click",async()=>{
  const btn=$("runBtn"); btn.disabled=true; $("err").style.display="none"; $("list").classList.remove("show");
  const root=$("root").value.trim(); const minMB=parseInt($("minMB").value)||100;
  if(!root){ showErr("请填写要扫描的盘符或文件夹路径。"); btn.disabled=false; return; }
  $("status").innerHTML='<span class="spinner"></span>正在扫描「'+esc(root)+'」，请稍候…';
  try{
    const r=await fetch(API+"/files/scan?root="+encodeURIComponent(root)+"&minMB="+minMB);
    const j=await r.json();
    if(!r.ok){ showErr(j.error||"扫描失败"); return; }
    const files=j.files||[];
    $("count").textContent=files.length;
    const rows=$("rows"); rows.innerHTML="";
    if(!files.length){ rows.innerHTML='<div class="empty">未在「'+esc(root)+'」中找到超过 '+minMB+' MB 的文件。</div>'; }
    else{
      files.slice().sort((a,b)=>b.size-a.size).forEach(f=>{
        const d=document.createElement("div"); d.className="row";
        const sz=document.createElement("span"); sz.className="sz"; sz.textContent=fmtSize(f.size);
        const p=document.createElement("span"); p.className="path"; p.title=f.path; p.textContent=f.path;
        d.appendChild(sz); d.appendChild(p); rows.appendChild(d);
      });
    }
    $("list").classList.add("show");
    $("status").textContent="扫描完成，共找到 "+files.length+" 个文件。";
  }catch(e){ showErr("连接原生服务失败："+(e.message||e)); $("status").textContent=""; }
  finally{ btn.disabled=false; upRun(); }
});
$("backBtn").addEventListener("click",()=>history.back());
(async()=>{
  try{ const r=await fetch(API+"/health"); backendOk=(await r.json()).status==="ok"; }
  catch(e){ backendOk=false; }
  if(backendOk){ setNote(true,"已连接本机原生服务，可扫描大文件。"); }
  else { setNote(false,"本机原生服务未启动，请重启「星屿」桌面图标。"); }
  upRun();
})();
</script>
</body>
</html>
