<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>课程表 · 超级日历</title>
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card-2:#FFFFFF;
  --label:#000000; --label-2:rgba(60,60,67,.72); --label-3:rgba(60,60,67,.45);
  --sep:rgba(60,60,67,.29); --hair:rgba(60,60,67,.14);
  --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.20);
  --blue:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500;
  --purple:#AF52DE; --teal:#30B0C7; --indigo:#5856D6; --pink:#FF2D55;
  --glass:rgba(242,242,247,.72);
  --shadow-card:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.07);
  --shadow-float:0 8px 30px rgba(0,0,0,.16);
  --spring:cubic-bezier(.32,.72,0,1);
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --accent:#007AFF; --on-accent:#ffffff; --accent-text:#0062CC;
  --pad-x:16px; --nav-h:56px; --rail-gap:12px;
}
[data-theme="dark"]{
  --bg:#000; --card:#1C1C1E; --card-2:#2C2C2E;
  --label:#FFF; --label-2:rgba(235,235,245,.68); --label-3:rgba(235,235,245,.42);
  --sep:rgba(84,84,88,.6); --hair:rgba(84,84,88,.45);
  --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.34);
  --glass:rgba(20,20,22,.72);
  --shadow-card:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--label);-webkit-font-smoothing:antialiased;
  padding-bottom:110px;transition:background .3s,color .3s;overflow-x:clip;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.nav{position:sticky;top:0;z-index:50;background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);
  border-bottom:.5px solid var(--hair);transition:background .3s}
.nav-inner{max-width:860px;margin:0 auto;padding:10px var(--pad-x);display:flex;align-items:center;gap:12px;min-height:var(--nav-h)}
/* v14 · 导航构件：退出胶囊 / 双行标识 / 分隔线 / 右侧工具区（与正文共用 --pad-x，从结构上杜绝错位） */
.back-btn{display:none}
.nav-id{display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0;flex:0 1 auto}
.nav-id .nav-k{font-size:15px;font-weight:600;letter-spacing:-.1px;line-height:1.15;color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-sub{font-size:11.5px;line-height:1.25;color:var(--label-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.nav-sep{width:1px;height:22px;background:var(--hair);flex:none}
.nav-tools{display:flex;align-items:center;gap:10px;margin-left:auto;flex:none}
.sched-nav{display:flex;align-items:center;gap:8px;flex:none}
@media (max-width:520px){
  .nav-sub{display:none}
  .nav-sep{display:none}
  .nav-id .nav-k{font-size:14px}
  #viewSeg button{padding:6px 11px}
}
.theme-seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.theme-seg button{padding:5px 14px;border-radius:7px;font-size:13px;font-weight:500;color:var(--label-2);min-height:32px;transition:all .25s var(--spring)}
.theme-seg button[aria-pressed="true"]{background:var(--card);color:var(--label);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.hero{padding:20px 0 8px}
.large-title{font-size:34px;font-weight:800}
.hero-sub{color:var(--label-2);font-size:15px;margin-top:4px}
.next-card{
  margin-top:16px;background:var(--card);border:.5px solid var(--hair);border-radius:var(--r-lg);
  box-shadow:var(--shadow-card);padding:18px;display:flex;align-items:center;gap:14px;
  transition:transform .25s var(--spring),box-shadow .25s;
}
.next-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-float)}
.next-ic{width:46px;height:46px;border-radius:12px;background:rgba(0,122,255,.14);color:var(--accent-text,var(--blue));display:flex;align-items:center;justify-content:center;flex:none}
.next-info{flex:1;min-width:0}
.next-kicker{font-size:11px;font-weight:600;color:var(--accent-text,var(--blue));letter-spacing:.4px;text-transform:uppercase}
.next-name{font-size:17px;font-weight:700;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next-meta{font-size:13px;color:var(--label-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next-time{text-align:right;flex:none}
.next-time .big{font-size:22px;font-weight:700;letter-spacing:-.4px}
.next-time .small{font-size:12px;color:var(--label-3)}
.chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip{background:var(--card);border:.5px solid var(--hair);border-radius:99px;padding:7px 14px;font-size:13px;color:var(--label-2);min-height:34px;display:flex;align-items:center;gap:6px}
.chip b{color:var(--label)}
.searchwrap{position:relative;margin-top:12px}
.searchbar{position:relative;display:flex;align-items:center}
.searchbar svg{position:absolute;left:12px;color:var(--label-3);pointer-events:none}
.searchbar input{
  width:100%;padding:11px 38px;font:inherit;font-size:16px;color:var(--label);
  background:var(--card);border:.5px solid var(--hair);border-radius:12px;
  box-shadow:var(--shadow-card);transition:box-shadow .2s,border .2s;
}
.searchbar input::placeholder{color:var(--label-3)}
.searchbar input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.25),var(--shadow-card)}
.sclear{position:absolute;right:6px;width:28px;height:28px;border-radius:50%;background:var(--fill-2);color:var(--label-2);display:none;align-items:center;justify-content:center;font-size:13px}
.sclear.show{display:flex}
.results{
  position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:45;
  background:var(--card);border:.5px solid var(--hair);border-radius:var(--r-md);
  box-shadow:var(--shadow-float);max-height:340px;overflow:auto;padding:6px;
}
.r-item{
  width:100%;display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;
  text-align:left;min-height:48px;transition:background .15s;
}
.r-item:hover{background:var(--fill)}
.r-dot{width:9px;height:9px;border-radius:50%;flex:none}
.r-main{flex:1;min-width:0}
.r-name{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.r-sub{font-size:12px;color:var(--label-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;display:block}
.r-time{font-size:12px;color:var(--label-3);flex:none}
.r-empty{padding:16px;text-align:center;font-size:14px;color:var(--label-3)}
.layout{display:block}
.main-col{min-width:0}
.side-col{min-width:0}

/* ===== 星屿嵌入模式 v14 · 全屏模块导航：退出胶囊取代「返回星屿」 ===== */
body.embed .back-btn{
  display:inline-flex;align-items:center;gap:6px;flex:none;
  height:32px;padding:0 13px 0 10px;border-radius:999px;
  background:var(--fill);color:var(--label-2);
  font-size:13px;font-weight:600;letter-spacing:.1px;
  transition:background .2s,color .2s,transform .18s var(--spring);
}
body.embed .back-btn svg{flex:none;opacity:.85;transition:transform .3s var(--spring)}
body.embed .back-btn:hover{background:var(--fill-2);color:var(--label)}
body.embed .back-btn:hover svg{transform:scale(.86)}
body.embed .back-btn:active{transform:scale(.95)}
body.embed .nav-inner{gap:12px}
body.embed .theme-seg{display:none!important}
body.embed .hero{display:none}
/* ===== 星屿主题桥接 v12：让课程表继承平台主题 ===== */
html.platform-theme{
  --bg:var(--xy-paper);
  --bg-2:var(--xy-paper-2);
  --card:var(--xy-paper-card);
  --card-2:var(--xy-paper-3);
  --label:var(--xy-ink);
  --label-2:var(--xy-ink-2);
  --label-3:var(--xy-ink-3);
  --sep:var(--xy-rule);
  --hair:var(--xy-rule-thin);
  --fill:var(--xy-fill);
  --fill-2:var(--xy-fill-2);
  --blue:var(--xy-accent);
  --green:var(--xy-success);
  --red:var(--xy-danger);
  --orange:var(--xy-warning);
  --teal:var(--xy-accent);
  --indigo:var(--xy-accent);
  --pink:var(--xy-danger);
  --glass:color-mix(in srgb,var(--xy-paper-card) 72%,transparent);
  --shadow-card:var(--xy-shadow);
  --shadow-float:var(--xy-shadow-hover);
  color-scheme:var(--xy-scheme,dark);
}
html.platform-theme body{
  font-family:var(--xy-font,-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif);
  background:transparent;
}
body.embed::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:var(--xy-bg-image,none);
  background-size:var(--xy-bg-size,cover);
  background-position:var(--xy-bg-position,center 30%);
  background-repeat:no-repeat;
  opacity:var(--xy-bg-opacity,.36);
}
/* ===== 星屿嵌入模式 v14 · 与独立版一致的栅格 + 满高右栏（消灭右下死空间） ===== */
html.embed-host,body.embed{
  margin:0;padding:0;min-height:100%;height:auto;background:var(--bg);
  overflow-x:clip;overflow-y:auto;
}
body.embed .tabbar{display:none!important}
body.embed .nav{position:sticky;top:0;z-index:50}
body.embed .nav-inner{max-width:1240px}
body.embed .wrap{max-width:1240px;margin:0 auto;padding:16px var(--pad-x) 40px}
body.embed .site-footer{margin-top:28px}
body.embed .layout{align-items:start}
@media (min-width:1024px){
  body.embed{--pad-x:24px}
  body.embed .layout{display:grid;grid-template-columns:minmax(0,1fr) 344px;gap:20px;align-items:start}
  body.embed .side-col{
    grid-column:2;grid-row:1;
    position:sticky;top:calc(var(--nav-h) + 16px);
    display:flex;flex-direction:column;gap:var(--rail-gap);
    height:var(--rail-h,auto);
    min-height:0;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain;
  }
  body.embed .side-col::-webkit-scrollbar{display:none}
  body.embed .main-col{grid-column:1;grid-row:1;min-width:0}
}
@media (max-width:1023px){
  body.embed .layout{display:block}
  body.embed .side-col{margin-bottom:14px}
}
@media (max-width:900px){
  body.embed .wrap{padding:14px var(--pad-x) 32px}
}
</style>
</head>
<style>
.schedule{margin-top:16px;background:var(--card);border:.5px solid var(--hair);border-radius:var(--r-lg);box-shadow:var(--shadow-card);overflow:hidden;transition:background .3s}
.sched-head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.sched-title{font-size:18px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-btn{width:32px;height:32px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--label-2);transition:background .2s}
.nav-btn:hover{background:var(--fill-2)}
.today-btn{padding:7px 14px;border-radius:99px;background:var(--fill);font-size:13px;font-weight:600;color:var(--accent-text,var(--blue));min-height:32px;transition:background .2s}
.today-btn:hover{background:var(--fill-2)}
.view-seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.view-seg button{padding:6px 16px;border-radius:7px;font-size:13px;font-weight:500;color:var(--label-2);min-height:32px;transition:all .25s var(--spring)}
.view-seg button[aria-pressed="true"]{background:var(--card);color:var(--label);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.week-scroll{overflow:auto;max-height:var(--wk-max,none);overscroll-behavior:contain;
  scrollbar-width:none;-ms-overflow-style:none;
  -webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);mask-image:linear-gradient(90deg,#000 92%,transparent)}
.week-scroll::-webkit-scrollbar{display:none}
.week-inner{min-width:720px;padding:0 16px 16px}
.dhead{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:12px 0 10px 60px;
  position:sticky;top:0;z-index:6;background:var(--card)}
.dh{min-height:48px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.dh .dow{font-size:11px;color:var(--label-3);font-weight:600}
.dh .dnum{font-size:15px;font-weight:700}
.dh.today{background:var(--blue)}
.dh.today .dow{color:rgba(255,255,255,.8)}
.dh.today .dnum{color:var(--on-accent,#fff)}
.weekbody{position:relative}
.gutter{position:absolute;left:16px;top:0;bottom:0;width:44px}
.gutter .gt{position:absolute;right:8px;transform:translateY(-50%);font-size:10.5px;color:color-mix(in srgb,var(--label-3) 78%,var(--label));font-weight:500;white-space:nowrap}
.daycols{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding-left:60px}
.daycol{position:relative;border-radius:10px;min-height:100%}
.daycol.today{background:rgba(0,122,255,.05)}
[data-theme="dark"] .daycol.today{background:rgba(0,122,255,.12)}
.gridline{position:absolute;left:0;right:0;height:.5px;background:var(--hair)}
.now-line{position:absolute;left:0;right:0;height:2px;background:var(--red);border-radius:2px;z-index:5}
.now-line::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.cls{
  position:absolute;left:3px;right:3px;border-radius:12px;padding:8px 9px 8px 11px;overflow:hidden;
  text-align:left;z-index:2;min-height:40px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c,#007AFF) 16%,transparent),color-mix(in srgb,var(--c,#007AFF) 7%,transparent));
  border:.5px solid color-mix(in srgb,var(--c,#007AFF) 28%,transparent);
  box-shadow:inset 3px 0 0 0 var(--c,#007AFF);
  transition:transform .18s var(--spring),box-shadow .18s;cursor:pointer;
  display:flex;flex-direction:column;justify-content:flex-start;gap:3px;
}
[data-theme="dark"] .cls{
  background:linear-gradient(180deg,color-mix(in srgb,var(--c,#007AFF) 26%,transparent),color-mix(in srgb,var(--c,#007AFF) 12%,transparent));
}
.cls:hover{transform:translateY(-2px);box-shadow:inset 3px 0 0 0 var(--c,#007AFF),0 8px 20px rgba(0,0,0,.18);z-index:3}
.cls:active{transform:scale(.97)}
.cls>.cn,.cls>.meta,.cls>.tags{min-width:0;max-width:100%}
.cls .cn{font-size:12px;font-weight:700;line-height:16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;word-break:normal}
.cls .meta{font-size:11px;line-height:15px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;overflow-wrap:anywhere}
.cls .tags{display:flex;flex-wrap:nowrap;align-items:center;gap:3px;margin-top:auto;overflow:hidden;pointer-events:none}
.slotp,.wktag{flex:0 1 auto;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slotp{font-size:10px;font-weight:700;padding:2px 5px;border-radius:5px;line-height:1;background:color-mix(in srgb,var(--c,#007AFF) 18%,transparent)}
.wktag{font-size:10px;font-weight:700;padding:2px 5px;border-radius:5px;line-height:1;background:color-mix(in srgb,var(--c,#007AFF) 18%,transparent)}
.cls.past{opacity:.5}
.cls.ongoing{z-index:4}
.cls.ongoing::after{content:"";position:absolute;inset:-2px;border-radius:13px;border:2px solid var(--c,#007AFF);opacity:.55;pointer-events:none;animation:livePulse 2.2s ease-in-out infinite}
@keyframes livePulse{50%{opacity:.12}}
.empty-note{position:absolute;left:8px;right:8px;top:38%;text-align:center;font-size:11px;color:var(--label-3);line-height:1.6;white-space:pre-line;pointer-events:none}
@keyframes flashPulse{
  0%{box-shadow:0 0 0 0 rgba(0,122,255,.55)}
  70%{box-shadow:0 0 0 10px rgba(0,122,255,0)}
  100%{box-shadow:0 0 0 0 rgba(0,122,255,0)}
}
.cls.flash{animation:flashPulse .9s ease-out 2;z-index:6}
.monthwrap{padding:0 16px 16px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mwd{font-size:11px;font-weight:600;color:var(--label-3);text-align:center;padding:6px 0;min-height:28px}
.mcell{min-height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:6px;transition:background .2s}
.mcell:hover{background:var(--fill)}
.mcell.dim{opacity:.35}
.mcell .mnum{font-size:14px;font-weight:600;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.mcell.today .mnum{background:var(--blue);color:var(--on-accent,#fff)}
.mcell.sel{background:rgba(0,122,255,.12)}
[data-theme="dark"] .mcell.sel{background:rgba(0,122,255,.25)}
.mdots{display:flex;gap:3px;height:5px;align-items:center}
.mdot{width:5px;height:5px;border-radius:50%}
.mmore{font-size:10px;color:var(--label-3);line-height:1}
.mempty{padding:28px 0 8px;text-align:center;color:var(--label-3);font-size:14px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);
  border-top:.5px solid var(--hair);padding-bottom:env(safe-area-inset-bottom);transition:background .3s}
.tabbar-inner{max-width:860px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 8px;color:var(--label-3);min-height:49px;transition:color .2s;-webkit-tap-highlight-color:transparent}
.tab svg{width:24px;height:24px}
.tab span{font-size:10px;font-weight:500}
.tab.active{color:var(--accent-text,var(--blue))}
.tab:active{opacity:.6}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:70;opacity:0;pointer-events:none;transition:opacity .35s}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(560px,100%);z-index:80;
  background:var(--card);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:var(--shadow-float);
  transition:transform .45s var(--spring);padding:8px 20px calc(24px + env(safe-area-inset-bottom))}
.sheet.show{transform:translate(-50%,0)}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--fill-2);margin:4px auto 14px}
.sheet-close{position:absolute;top:12px;right:14px;width:30px;height:30px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--label-2);font-size:15px}
.detail-row{display:flex;align-items:center;gap:12px;padding:12px 0;min-height:44px}
.detail-row + .detail-row{border-top:.5px solid var(--sep)}
.dr-ic{width:32px;height:32px;border-radius:9px;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--label-2);flex:none}
.dr-label{font-size:12px;color:var(--label-3)}
.dr-value{font-size:15px;font-weight:500;margin-top:1px}
.sheet h3{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
.cdot{width:10px;height:10px;border-radius:50%;flex:none}
.sheet-actions{display:flex;gap:10px;margin-top:16px}
.btn-primary{flex:1;padding:12px;border-radius:var(--r-sm);background:var(--blue);color:var(--on-accent,#fff);font-size:15px;font-weight:600;min-height:44px;transition:transform .15s}
.btn-primary:active{transform:scale(.97)}
.btn-ghost{padding:12px 18px;border-radius:var(--r-sm);color:var(--accent-text,var(--blue));font-size:15px;font-weight:500;min-height:44px}
.btn-ghost:hover{background:var(--fill)}
/* v3 polish */
.hero{position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;top:-30px;right:-40px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(94,92,230,.16),transparent 70%),radial-gradient(closest-side,rgba(191,90,242,.13),transparent 70%);
  filter:blur(10px);pointer-events:none}
.hero>*{position:relative}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chip{flex-direction:column;align-items:flex-start;gap:2px;border-radius:14px;padding:12px 14px;min-height:64px;transition:transform .25s var(--spring),box-shadow .25s}
.chip:hover{transform:translateY(-2px);box-shadow:var(--shadow-card)}
.chip .cv{font-size:22px;font-weight:800;letter-spacing:-.4px;color:var(--label);line-height:1}
.chip .ck{font-size:11px;color:var(--label-2);font-weight:600}
.side-card{background:var(--card);border:.5px solid var(--hair);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:14px 16px}
.togglerow{display:flex;align-items:center;gap:12px;margin-top:12px}
.togglerow .tt{font-size:14px;font-weight:600}
.togglerow .td{font-size:12px;color:var(--label-2);margin-top:2px}
.togglerow .switch{margin-left:auto}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;z-index:2}
.knob-track{position:absolute;inset:0;background:var(--fill-2);border-radius:99px;transition:background .25s}
.knob{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .25s var(--spring)}
.switch input:checked ~ .knob-track{background:var(--green)}
.switch input:checked ~ .knob{transform:translateX(20px)}
.switch input:focus-visible ~ .knob-track{outline:3px solid var(--blue);outline-offset:2px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.anim-in{animation:fadeUp .35s var(--spring)}
.site-footer{margin-top:36px;border-top:.5px solid var(--hair);background:var(--card);transition:background .3s}
.footer-inner{max-width:860px;margin:0 auto;padding:26px 16px 22px}
.footer-cols{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:18px}
.footer-brand .fb-title{font-size:15px;font-weight:700}
.footer-brand p{font-size:13px;color:var(--label-2);margin-top:6px;line-height:1.55;max-width:260px}
.fcol h4{font-size:12px;font-weight:600;color:var(--label-3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.fcol button{display:block;font-size:13.5px;color:var(--label-2);padding:4px 0;min-height:28px;text-align:left;transition:color .15s}
.fcol button:hover{color:var(--accent-text,var(--blue))}
.copy{border-top:.5px solid var(--hair);margin-top:20px;padding-top:13px;font-size:12px;color:var(--label-3);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
@media (max-width:600px){.footer-cols{grid-template-columns:1fr 1fr}}
/* v5 import */
.sheet{max-height:86vh}
#sheetBody{max-height:calc(86vh - 84px);overflow:auto;padding-right:2px}
.iseg{margin-top:12px}
.itext,.iselect{width:100%;padding:10px 12px;font:inherit;font-size:15px;color:var(--label);background:var(--card-2);border:.5px solid var(--hair);border-radius:10px;transition:border .2s,box-shadow .2s}
.itext:focus,.iselect:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.25)}
textarea.itext{resize:vertical;min-height:130px;line-height:1.6}
.flabel{display:block;font-size:12px;font-weight:600;color:var(--label-2);margin:12px 0 5px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.fgrid .span2{grid-column:1/-1}
.ihint{font-size:12px;color:var(--label-3);margin:8px 0 2px;line-height:1.55}
.prev-list{max-height:200px;overflow:auto;margin-top:10px;border:.5px solid var(--hair);border-radius:12px;padding:6px;background:var(--card-2)}
.prev-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;min-height:44px}
.prev-row.bad{opacity:.75}
.pwarn{color:var(--orange);font-size:14px;flex:none}
.prev-row .r-main{flex:1;min-width:0}
.reset-link{margin-top:12px;color:var(--red);font-size:13.5px;font-weight:500;min-height:32px}
.reset-link:hover{opacity:.8}
.cdots{display:flex;gap:10px;flex-wrap:wrap}
.cdots label{position:relative;cursor:pointer}
.cdots input{position:absolute;opacity:0;inset:0}
.cdots span{width:26px;height:26px;border-radius:50%;background:var(--c);display:block;box-shadow:0 0 0 2px transparent;transition:box-shadow .2s}
.cdots input:checked+span{box-shadow:0 0 0 2px var(--label)}
.cdots input:focus-visible+span{outline:3px solid var(--blue);outline-offset:2px}
.qrow{display:flex;gap:10px;margin-top:12px}
.qbtn{flex:1;min-height:42px;border-radius:10px;font-size:13.5px;font-weight:600;transition:transform .15s,background .2s}
.qbtn.primary{background:var(--blue);color:var(--on-accent,#fff)}
.qbtn.primary:active{transform:scale(.97)}
.qbtn.ghost{background:var(--fill);color:var(--label-2)}
.qbtn.ghost:hover{background:var(--fill-2)}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:50%;transform:translate(-50%,-16px);z-index:90;background:rgba(30,30,32,.88);color:#fff;padding:9px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s var(--spring);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}
.file-row{margin-top:12px}
.filebtn{position:relative;display:flex;align-items:center;justify-content:center;width:100%}
.filebtn input{position:absolute;inset:0;width:100%;opacity:0;cursor:pointer}
@media (min-width:1024px){
  :root{--pad-x:24px}
  .wrap{max-width:1240px}
  .nav-inner{max-width:1240px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 344px;gap:20px;align-items:start}
  .side-col{grid-column:2;grid-row:1;position:sticky;top:calc(var(--nav-h) + 16px);display:flex;flex-direction:column;gap:var(--rail-gap);height:var(--rail-h,auto);min-height:0;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain}
  .side-col::-webkit-scrollbar{display:none}
  .main-col{grid-column:1;grid-row:1}
  .side-col>*{margin-top:0}
  .schedule{margin-top:0}
  .week-scroll{-webkit-mask-image:none;mask-image:none;scrollbar-width:thin;scrollbar-color:var(--fill-2) transparent}
  .week-scroll::-webkit-scrollbar{display:block;width:9px;height:9px}
  .week-scroll::-webkit-scrollbar-thumb{background:var(--fill-2);border-radius:9px;border:2.5px solid var(--card)}
  .week-scroll::-webkit-scrollbar-thumb:hover{background:var(--label-3)}
  .week-scroll::-webkit-scrollbar-track{background:transparent}
  .week-inner{min-width:0;padding:0 14px 14px}
  /* v14b · 月视图撑满同一块画布，切周/月不再塌陷，右栏始终等高 */
  #monthView .monthwrap{height:var(--wk-max,auto);display:flex;flex-direction:column;padding:0 14px 14px}
  #monthView .mgrid{flex:1;min-height:0;grid-template-rows:auto;grid-auto-rows:minmax(48px,1fr);align-content:stretch}
  .dhead,.daycols{padding-left:66px}
  .gutter{width:48px;left:14px}
  .tabbar-inner{max-width:1240px}
  .footer-inner{max-width:1240px}
}
@media (max-width:600px){
  .large-title{font-size:28px}
  .next-card{padding:14px}
  .next-time .big{font-size:18px}
  .sched-head{flex-wrap:wrap}
  .sched-title{flex-basis:100%;order:-1}
  .theme-seg button{padding:5px 10px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
/* ===== v14 · 右栏卡片系统：今日课程 / 本周概览 / 课程图例 ===== */
.rail-card{background:var(--card);border:.5px solid var(--hair);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:13px 14px;display:flex;flex-direction:column;min-height:0;transition:background .3s}
.rail-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex:none}
.rail-head h3{font-size:13px;font-weight:700;letter-spacing:.2px;color:var(--label);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-badge{font-size:11px;font-weight:600;color:var(--label-3);background:var(--fill);border-radius:99px;padding:3px 9px;line-height:1.45;flex:none;font-variant-numeric:tabular-nums}
.today-card{flex:1 1 auto}
.today-list{overflow:auto;min-height:0;margin:0 -4px;padding:0 4px;scrollbar-width:thin}
.today-list::-webkit-scrollbar{width:6px}
.today-list::-webkit-scrollbar-thumb{background:var(--fill-2);border-radius:3px}
.tl-row{width:100%;display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:11px;text-align:left;min-height:52px;transition:background .18s,transform .18s var(--spring)}
.tl-row+.tl-row{margin-top:2px}
.tl-row:hover{background:var(--fill)}
.tl-row:active{transform:scale(.985)}
.tl-row.past{opacity:.45}
.tl-time{flex:none;width:40px;display:flex;flex-direction:column;gap:1px;font-variant-numeric:tabular-nums}
.tl-time b{font-size:12.5px;font-weight:700;line-height:1.25;color:var(--label)}
.tl-time i{font-style:normal;font-size:10.5px;line-height:1.25;color:var(--label-3)}
.tl-bar{flex:none;width:3px;align-self:stretch;min-height:26px;border-radius:2px;background:var(--c,#007AFF)}
.tl-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tl-name{font-size:13.5px;font-weight:600;line-height:1.3;color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-meta{font-size:11.5px;line-height:1.3;color:var(--label-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-live{flex:none;font-size:10px;font-weight:700;color:var(--on-accent,#fff);background:var(--red);border-radius:99px;padding:3px 7px;line-height:1}
.tl-row.ongoing{background:color-mix(in srgb,var(--blue) 11%,transparent)}
.tl-row.ongoing:hover{background:color-mix(in srgb,var(--blue) 16%,transparent)}
.tl-empty{display:flex;flex-direction:column;align-items:center;gap:5px;padding:24px 10px;text-align:center;color:var(--label-3)}
.tl-empty b{font-size:13.5px;font-weight:600;color:var(--label-2)}
.tl-empty span{font-size:12px;line-height:1.55}
.overview-card{flex:0 1 auto;min-height:112px;overflow:auto;scrollbar-width:none;overscroll-behavior:contain}
.overview-card::-webkit-scrollbar{display:none}
.overview-card .chips{margin-top:0;flex:none}
.overview-card .legend{flex:none}
.overview-card .chip{background:var(--fill);border:0;box-shadow:none;border-radius:12px;padding:10px 11px;min-height:56px}
.overview-card .chip:hover{transform:none;box-shadow:none;background:var(--fill-2)}
.overview-card .chip .cv{font-size:19px}
.overview-card .chip .cv small{font-size:11px;font-weight:700;opacity:.55;margin-left:1px}
.legend{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px;padding-top:11px;border-top:.5px solid var(--hair)}
.lg-item{display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:4px 9px 4px 7px;border-radius:99px;background:var(--fill);font-size:11.5px;font-weight:500;color:var(--label-2);transition:background .18s,color .18s}
.lg-item:hover{background:var(--fill-2);color:var(--label)}
.lg-dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c,#007AFF)}
.lg-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:126px}
.lg-empty{width:100%;font-size:12px;line-height:1.5;color:var(--label-3);padding:1px 0}
/* ===== v14b · 矮视口右栏瘦身：≤820px 高时压缩固定块，保证导入/导出始终在视野内 ===== */
@media (min-width:1024px) and (max-height:820px){
  .next-card{padding:13px;gap:11px}
  .next-ic{width:38px;height:38px;border-radius:10px}
  .next-ic svg{width:19px;height:19px}
  .next-name{font-size:16px}
  .next-time .big{font-size:19px}
  .rail-card{padding:11px 12px}
  .rail-head{margin-bottom:8px}
  .overview-card .chip{min-height:48px;padding:8px 10px;border-radius:11px}
  .overview-card .chip .cv{font-size:17px}
  .legend{margin-top:9px;padding-top:9px;gap:4px}
  .lg-item{padding:3px 8px 3px 6px;font-size:11px}
  .side-card{padding:11px 13px}
  .qbtn{min-height:38px;font-size:13px}
  .tl-row{min-height:46px;padding:6px 8px}
  .tl-empty{padding:16px 10px}
}
@media (min-width:1024px) and (max-height:700px){
  .overview-card{min-height:92px}
  .next-ic{display:none}
  .chips{gap:8px}
}
/* ===== v14 · 空周状态：整周没课时不再留一片空白网格 ===== */
.week-empty{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;padding:20px;border-radius:12px;background:color-mix(in srgb,var(--card) 74%,transparent);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.we-in{max-width:400px;display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}
.we-ic{width:54px;height:54px;border-radius:17px;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--label-3);margin-bottom:2px}
.we-t{font-size:17px;font-weight:700;color:var(--label)}
.we-d{font-size:13px;line-height:1.65;color:var(--label-2)}
.we-acts{display:flex;gap:9px;margin-top:8px;flex-wrap:wrap;justify-content:center}
.we-btn{min-height:38px;padding:0 17px;border-radius:99px;font-size:13px;font-weight:600;transition:transform .18s var(--spring),background .2s}
.we-btn:active{transform:scale(.96)}
.we-btn.primary{background:var(--blue);color:var(--on-accent,#fff)}
.we-btn.ghost{background:var(--fill);color:var(--label-2)}
.we-btn.ghost:hover{background:var(--fill-2)}
/* ===== v14 · 课程卡按可用高度降级，杜绝文字被裁切/重叠 ===== */
.cls.sm{padding:6px 8px 6px 10px;gap:2px}
.cls.sm .meta{display:none}
.cls.xs{padding:4px 7px 4px 9px;gap:0}
.cls.xs .meta,.cls.xs .tags{display:none}
.cls.xs .cn{-webkit-line-clamp:2;font-size:11px;line-height:14px}
/* ===== v14e · 同时段冲突并排：窄卡降级排版 + 琥珀描边提示，杜绝卡片互相压字 ===== */
.cls.split{padding-left:8px;border-radius:10px;
  box-shadow:inset 2px 0 0 0 var(--c,#007AFF),inset 0 0 0 1px rgba(255,149,0,.5)}
.cls.split:hover{box-shadow:inset 2px 0 0 0 var(--c,#007AFF),inset 0 0 0 1px rgba(255,149,0,.72),0 8px 20px rgba(0,0,0,.18)}
.cls.split .tags{display:none}
.cls.split .cn{-webkit-line-clamp:3}
.cls.xs.split .cn{-webkit-line-clamp:2}
.cls.split3{padding:5px 6px 5px 8px;gap:1px}
.cls.split3 .meta{display:none}
.cls.split3 .cn{-webkit-line-clamp:2;font-size:11px;line-height:14px}
@media (max-width:1023px){
  .today-card{flex:none}
  .today-list{max-height:300px}
}
</style>
</head>
<body>
<nav class="nav" aria-label="主导航">

      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14h6v6"/><path d="M20 10h-6V4"/><path d="m14 10 7-7"/><path d="m3 21 7-7"/></svg>
      <span>退出全屏</span>

    <div class="nav-sep" aria-hidden="true"></div>

  </header>
  <div class="layout">
<aside class="side-col">
      <div class="next-card" id="nextCard" role="button" tabindex="0" aria-label="查看下一节课详情">
        <div class="next-ic" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>

const $=id=>document.getElementById(id);

const mondayOf=d=>{const x=new Date(d);const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);x.setHours(0,0,0,0);return x};
const semWeek=mon=>Math.max(1,Math.floor((mon-SEM_START)/6048e5)+1);
const weekParity=mon=>(semWeek(mon)-1)%2+1;
function coursesForDate(d){

    if(c.day!==dow)return false;

}
function toHex(v){
  if(typeof v!=="string")return null;
  const s=v.trim();
  if(/^#[0-9a-f]{6}$/i.test(s))return s.toLowerCase();
  if(/^#[0-9a-f]{3}$/i.test(s))return ("#"+s[1]+s[1]+s[2]+s[2]+s[3]+s[3]).toLowerCase();
  const m=s.match(/rgba?\(\s*([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)/i);
  if(m){const h=x=>Math.round(Math.max(0,Math.min(255,+x))).toString(16).padStart(2,"0");return "#"+h(m[1])+h(m[2])+h(m[3]);}
  const g=s.match(/color\(srgb\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)/i);
  if(g){const h=x=>Math.round(Math.max(0,Math.min(255,+x*255))).toString(16).padStart(2,"0");return "#"+h(g[1])+h(g[2])+h(g[3]);}
  return null;
}
function hexA(hex,a){
  const c=toHex(hex)||"#007AFF";
  const n=parseInt(c.slice(1),16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
}
function shadeHex(hex,amt){
  const c=toHex(hex);if(!c)return hex;
  const n=parseInt(c.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  if(amt>=0){r+=(255-r)*amt;g+=(255-g)*amt;b+=(255-b)*amt;}
  else{const k=1+amt;r*=k;g*=k;b*=k;}
  const h=v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0");
  return "#"+h(r)+h(g)+h(b);
}
function isDarkUI(){return document.documentElement.dataset.theme==="dark";}
function relLum(v){
  const c=toHex(v);if(!c)return .5;
  const n=parseInt(c.slice(1),16);
  const f=x=>{x/=255;return x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4);};
  return .2126*f(n>>16&255)+.7152*f(n>>8&255)+.0722*f(n&255);

function contrast(a,b){const l1=relLum(a),l2=relLum(b);return (Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05);}
/* 强调色上的文字：优先白字（iOS 惯例，如 #007AFF 上的白色标签）；
   仅当强调色太亮、白字撑不住 3.2:1 时（如平台亮天蓝 #38bdf8 只有 2.14:1）才改用近黑字。*/
function inkOn(hex){
  if(contrast("#ffffff",hex)>=3.2)return "#ffffff";
  return contrast("#0b1220",hex)>=contrast("#ffffff",hex)?"#0b1220":"#ffffff";
}
/* 把强调色调整到能在指定纸面上达到目标对比度（浅底压暗、深底提亮） */
function fitTextOn(accent,bgHex,target){
  const bg=toHex(bgHex)||"#ffffff";
  if(contrast(accent,bg)>=target)return accent;
  const darken=relLum(bg)>relLum(accent);
  let best=accent;
  for(let i=1;i<=20;i++){
    best=darken?shadeHex(accent,-.05*i):shadeHex(accent,.05*i);
    if(contrast(best,bg)>=target)break;
  }
  return best;
}
/* 平台强调色（如 #38bdf8）既做「蓝底白字」的底、又做纸面文字色，
   两种场景对比度要求相反，这里派生两个 token 分别满足 WCAG AA。*/
function syncAccent(){
  const root=document.documentElement,cs=getComputedStyle(root);
  const raw=cs.getPropertyValue("--xy-accent").trim()||cs.getPropertyValue("--blue").trim()||"#007AFF";
  const hex=toHex(raw)||"#007AFF";
  const paper=toHex(cs.getPropertyValue("--bg").trim())||(isDarkUI()?"#000000":"#ffffff");
  root.style.setProperty("--accent",hex);
  root.style.setProperty("--on-accent",inkOn(hex));
  root.style.setProperty("--accent-text",fitTextOn(hex,paper,4.6));
}
/* ---- 课程卡配色：底色/边框/色条用纯课程色，文字色按「实际合成后的底色」反解 ----
   卡片底 = 课程色 16%(浅)/26%(深) 叠在纸面上；标签底 = 课程色 18% 再叠一层。
   文字色必须同时在这两层底上达到 WCAG AA，否则会和同色系底色糊在一起
   （修复前浅色主题实测低至 1.44:1）。这里用逐步加深/提亮迭代求解，
   因此平台换任何强调色、任何纸面亮度都能自动达标。*/
let _paperCache=null,_fgCache=new Map();
function invalidateTintCache(){_paperCache=null;_fgCache.clear();}
function mixHex(fgHex,bgHex,alpha){
  const f=parseInt(toHex(fgHex).slice(1),16),b=parseInt(toHex(bgHex).slice(1),16);
  const h=v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0");
  const ch=i=>h(((f>>(16-8*i))&255)*alpha+((b>>(16-8*i))&255)*(1-alpha));
  return "#"+ch(0)+ch(1)+ch(2);
}
function paperHex(){
  if(_paperCache)return _paperCache;
  const cs=getComputedStyle(document.documentElement);
  _paperCache=toHex(cs.getPropertyValue("--bg").trim())||(isDarkUI()?"#000000":"#ffffff");
  return _paperCache;
}
function resolveCourseColor(key){
  let c=COLORS[key]?.c;
  if(!c && typeof key==="string" && /^#[0-9a-f]{6}$/i.test(key)) c=key;
  if(!c){const i=PALETTE[(String(key||"x").length+String(key||"x").charCodeAt(0))%PALETTE.length];c=COLORS[i].c;}
  return toHex(c)||"#007AFF";
}
function fitFg(hex,cardBg,chipBg){
  const dark=isDarkUI();
  const ok=c=>contrast(c,chipBg)>=5.4&&contrast(c,cardBg)>=5.0;
  let cand=hex;
  for(let i=0;i<=25;i++){
    cand=dark?shadeHex(hex,.04*i):shadeHex(hex,-.04*i);
    if(ok(cand))return cand;
  }
  return cand;
}
function tinted(key){
  const hex=resolveCourseColor(key);
  const ck=hex+(isDarkUI()?"|d":"|l");
  let fg=_fgCache.get(ck);
  if(!fg){
    const cardBg=mixHex(hex,paperHex(),isDarkUI()?.26:.16);
    const chipBg=mixHex(hex,cardBg,.18);
    fg=fitFg(hex,cardBg,chipBg);
    _fgCache.set(ck,fg);
  }
  return{bg:hexA(hex,.14),fg,c:hex};
}
const TODAY=new Date();
let view="week", weekStart=mondayOf(TODAY), monthCur=new Date(TODAY.getFullYear(),TODAY.getMonth(),1), selDate=null, showWeekend=localStorage.getItem("csShowWeekend")==="1";

/* ===== v14e · 同日冲突排布 =====
 * 贪心分列：按「渲染后的实际几何」判冲突，而不是只比时间——
 * 因为 .cls 有 min-height:40px，一节 20 分钟的短课会被撑到压住下一节，
 * 只比时间会漏判。列数 = 该冲突簇里同时并排的最大课程数。
 */
const CARD_MIN_PX=40;
function layoutDay(list){
  const items=list.map(function(c){
    const s=(toMin(c.start)-DAY_START*60)/60*HOUR_H;
    const e=(toMin(c.end)-DAY_START*60)/60*HOUR_H;
    return{c:c,s:s,ve:Math.max(e,s+CARD_MIN_PX),col:0,n:1};
  }).sort(function(a,b){return a.s-b.s||(b.ve-b.s)-(a.ve-a.s);});
  let cluster=[],clusterEnd=-Infinity;
  function flush(){
    if(!cluster.length)return;
    let n=0;
    cluster.forEach(function(x){if(x.col+1>n)n=x.col+1;});
    cluster.forEach(function(x){x.n=n;});
    cluster=[];clusterEnd=-Infinity;
  }
  items.forEach(function(it){
    if(cluster.length&&it.s>=clusterEnd)flush();
    let col=0;
    while(cluster.some(function(x){return x.col===col&&it.s<x.ve&&it.ve>x.s;}))col++;
    it.col=col;cluster.push(it);
    if(it.ve>clusterEnd)clusterEnd=it.ve;
  });
  flush();
  const map=new Map();
  items.forEach(function(it){map.set(it.c,it);});
  return map;
}
function renderWeek(){
  const head=$("dhead"),cols=$("daycols");
  head.innerHTML="";cols.innerHTML="";

  for(let i=0;i<7;i++)weekCount+=coursesForDate(addDays(weekStart,i)).length;
  const weekEmpty=weekCount===0;

    const t=document.createElement("div");t.className="gt";

    head.appendChild(h);
    const col=document.createElement("div");col.className="daycol"+(isT?" today":"");

    for(let hh=DAY_START+1;hh<dayEnd;hh++){
      const l=document.createElement("div");l.className="gridline";
      l.style.top=((hh-DAY_START)*HOUR_H)+"px";col.appendChild(l);
    }
    const list=coursesForDate(d);
    const lay=layoutDay(list);
    if(!list.length&&!weekEmpty){
      const e=document.createElement("div");e.className="empty-note";
      e.textContent=(d.getDay()===0||d.getDay()===6)?"周末无课\n好好休息 🌿":"本日无课";
      col.appendChild(e);
    }
    list.forEach(c=>{
      const b=document.createElement("button");b.className="cls";b.dataset.id=c.id;
      const t=tinted(c.color);
      b.style.color=t.fg;
      b.style.setProperty("--c",t.c);
      const top=(toMin(c.start)-DAY_START*60)/60*HOUR_H;
      const hgt=(toMin(c.end)-toMin(c.start))/60*HOUR_H;
      b.style.top=top+"px";b.style.height=hgt+"px";
      if(hgt<64)b.classList.add("xs");else if(hgt<88)b.classList.add("sm");
      /* v14e · 同时段冲突：横向分列并排，谁也不压谁 */
      const L=lay.get(c);
      if(L&&L.n>1){
        const w=100/L.n;
        b.style.left="calc("+(L.col*w).toFixed(4)+"% + 2px)";
        b.style.width="calc("+w.toFixed(4)+"% - 4px)";
        b.style.right="auto";
        b.style.zIndex=String(2+L.col);
        b.classList.add("split","conflict");
        if(L.n>2)b.classList.add("split3");
        b.dataset.conflictN=String(L.n);
      }
      const sMin=toMin(c.start),eMin=toMin(c.end);
      const ongoing=isT&&nowMin>=sMin&&nowMin<eMin;
      const past=isT&&nowMin>=eMin;
      if(ongoing)b.classList.add("ongoing");
      if(past)b.classList.add("past");
      const slotMap={"08:00":"1-2节","10:00":"3-4节","14:00":"5-6节","16:00":"7-8节","19:00":"9-10节"};
      const slot=slotMap[c.start]||"";
      b.title=c.name+(c.room?" · "+c.room:"")+"  "+c.start+"-"+c.end+((L&&L.n>1)?("　⚠ 与同时段另外 "+(L.n-1)+" 门课并排显示"):"");
      b.innerHTML=
        '<span class="cn">'+esc(c.name)+'</span>'+
        '<span class="meta">'+esc(c.room||"教室待定")+' · '+c.start+'</span>'+

function parseWeeksStr(str){
  const t=(str||"").trim();if(!t)return null;
  const set=new Set();
  if(/单周/.test(t))for(let w=1;w<=17;w+=2)set.add(w);
  if(/双周/.test(t))for(let w=2;w<=16;w+=2)set.add(w);
  if(/前[八8]周/.test(t))for(let w=1;w<=8;w++)set.add(w);
  if(/后[八8]周/.test(t))for(let w=9;w<=16;w++)set.add(w);
  let m;const re=/(\d{1,2})\s*[-–—~]\s*(\d{1,2})/g;
  while((m=re.exec(t)))for(let w=+m[1];w<=+m[2];w++)set.add(w);
  const re2=/\d{1,2}/g;
  while((m=re2.exec(t)))set.add(+m[0]);
  if(!set.size)return null;
  const arr=[...set].filter(w=>w>=1&&w<=30).sort((a,b)=>a-b);
  return arr.length?arr:null;
}
function scanWeeks(s){
  const set=new Set();let w=s,m;
  while((m=w.match(/单周/))){for(let i=1;i<=17;i+=2)set.add(i);w=w.replace(m[0]," ");}
  while((m=w.match(/双周/))){for(let i=2;i<=16;i+=2)set.add(i);w=w.replace(m[0]," ");}
  while((m=w.match(/前[八8]周/))){for(let i=1;i<=8;i++)set.add(i);w=w.replace(m[0]," ");}
  while((m=w.match(/后[八8]周/))){for(let i=9;i<=16;i++)set.add(i);w=w.replace(m[0]," ");}
  while((m=w.match(/第?\s*(\d{1,2})\s*[-–—~]\s*(\d{1,2})\s*周/))){for(let i=+m[1];i<=+m[2];i++)set.add(i);w=w.replace(m[0]," ");}
  while((m=w.match(/第?\s*((?:\d{1,2}\s*[,，]\s*)+\d{1,2})\s*周/))){m[1].split(/[,，]/).forEach(x=>set.add(+x.trim()));w=w.replace(m[0]," ");}
  while((m=w.match(/第\s*(\d{1,2})\s*周/))){set.add(+m[1]);w=w.replace(m[0]," ");}
  return set.size?{weeks:[...set].sort((a,b)=>a-b),text:w}:{weeks:null,text:s};

  if(!start&&singles.length>=2){start=singles[0];end=singles[1];}

  if(day==null)return{ok:false,line,reason:"未识别星期（如 周一 / 星期三）"};
  if(!start||!end)return{ok:false,line,reason:"未识别时间（如 08:00-09:40 或 1-2节）"};
  if(end<=start)return{ok:false,line,reason:"结束时间需晚于开始时间"};

  });

    r.forEach((cell,ci)=>{const mm=cell.match(/(?:周|星期)\s*([一二三四五六日天1-7])/);if(mm)m.set(ci,DOW_CH[mm[1]]);});

  });

  }

    if(headIdx>=0&&ri<=headIdx)return;

    const label=(r[0]||"").trim();
    const tmm=label.match(/(\d{1,2})[:：点](\d{2})?\s*[-–—~～至]\s*(\d{1,2})[:：点](\d{2})?/);
    if(tmm)base={start:pad2(+tmm[1])+":"+(tmm[2]||"00"),end:pad2(+tmm[3])+":"+(tmm[4]||"00")};
    const cnl=label.replace(/[一二三四五六七八九十]/g,ch=>({"一":"1","二":"2","三":"3","四":"4","五":"5","六":"6","七":"7","八":"8","九":"9","十":"10"}[ch]||ch));

    const nameLen=dv.getUint16(p+28,true);
    const extraLen=dv.getUint16(p+30,true);

}

      b=u8cat(mf.map(s=>mini.subarray(s*MS,(s+1)*MS))).subarray(0,wb.size);
    }else b=readChain(wb.start).subarray(0,wb.size);
    const bdv=new DataView(b.buffer,b.byteOffset,b.byteLength);
    const recs=[];let p=0;
    while(p+4<=b.length){const id=bdv.getUint16(p,true),len=bdv.getUint16(p+2,true);recs.push({id,len,p});p+=4+len;}
    let strings=[];
    const sst=recs.find(r=>r.id===0x00FC);
    if(sst){
      const segs=[b.subarray(sst.p+4,sst.p+4+sst.len)];
      for(const r of recs){if(r.p<=sst.p)continue;if(r.id===0x003C)segs.push(b.subarray(r.p+4,r.p+4+r.len));else break;}
      let seg=0,off=0;
      const rd=n=>{const out=new Uint8Array(n);let got=0;
        while(got<n){
          if(off>=segs[seg].length){seg++;off=0;if(seg>=segs.length)break;}
          const take=Math.min(n-got,segs[seg].length-off);
          out.set(segs[seg].subarray(off,off+take),got);off+=take;got+=take;
        }return out;};
      const r16=()=>{const x=rd(2);return x[0]|x[1]<<8;};
      const r32=()=>{const x=rd(4);return (x[0]|x[1]<<8|x[2]<<16|x[3]<<24)>>>0;};
      r32();
      const unique=r32();
      const uni=new TextDecoder("utf-16le"),lat=new TextDecoder("latin1");
      for(let i=0;i<unique;i++){
        if(seg>=segs.length)break;
        const cch=r16();
        let flags;
        if(off>=segs[seg].length){seg++;off=0;if(seg>=segs.length)break;flags=rd(1)[0];}
        else flags=rd(1)[0];
        const raw=rd(cch*((flags&1)?2:1));
        strings.push((flags&1)?uni.decode(raw):lat.decode(raw));
        if(flags&8){const n=r16();rd(4*n);}
        if(flags&4){const n=r32();rd(n);}
      }
    }
    const bof=recs.find(r=>r.id===0x0809);
    const biff8=bof?bdv.getUint16(bof.p+4,true)===0x0600:true;
    const cells=new Map();
    const setCell=(r,c,v)=>{if(!cells.has(r))cells.set(r,new Map());cells.get(r).set(c,v);};
    const rkNum=rk=>{if(rk&2)return(rk>>2)/((rk&1)?100:1);const tmp=new Uint8Array(8);const tdv=new DataView(tmp.buffer);tdv.setUint32(0,rk&0xFFFFFFFC,true);const v=tdv.getFloat64(0,true);return(rk&1)?v/100:v;};
    for(const r of recs){
      const o=r.p+4;
      if(r.id===0x00FD){const row=bdv.getUint16(o,true),col=bdv.getUint16(o+2,true),i=bdv.getUint32(o+6,true);setCell(row,col,strings[i]??"");}
      else if(r.id===0x0204){
        const row=bdv.getUint16(o,true),col=bdv.getUint16(o+2,true);
        if(biff8){const cch=bdv.getUint16(o+6,true),fl=b[o+8];const raw=b.subarray(o+9,o+9+cch*((fl&1)?2:1));setCell(row,col,(fl&1)?new TextDecoder("utf-16le").decode(raw):new TextDecoder("latin1").decode(raw));}
        else{const cch=b[o+6];const raw=b.subarray(o+7,o+7+cch);let str;try{str=new TextDecoder("gbk").decode(raw);}catch(e){str=new TextDecoder("latin1").decode(raw);}setCell(row,col,str);}
      }
      else if(r.id===0x0203){const row=bdv.getUint16(o,true),col=bdv.getUint16(o+2,true);setCell(row,col,String(bdv.getFloat64(o+6,true)));}
      else if(r.id===0x027E){const row=bdv.getUint16(o,true),col=bdv.getUint16(o+2,true);setCell(row,col,String(rkNum(bdv.getUint32(o+6,true))));}
      else if(r.id===0x00BD){const row=bdv.getUint16(o,true),first=bdv.getUint16(o+2,true);const n=(r.len-6)/2-1;for(let i=0;i<n;i++)setCell(row,first+i,String(rkNum(bdv.getUint32(o+6+i*4,true))));}
    }
    if(!cells.size)return null;
    const rows=[...cells.keys()].sort((a,b)=>a-b);
    let maxC=0;for(const m of cells.values())for(const c of m.keys())if(c>maxC)maxC=c;
    return rows.map(r=>{const line=[];for(let c=0;c<=maxC;c++)line.push((cells.get(r).get(c)||"").replace(/\r/g,"").replace(/\n/g,"⏎").trim());return line.join("\t");}).join("\n");
  }catch(e){return null;}
}
function parseCellEntries(cell,day,base,idx,out){
  const start=base?base.start:null,end=base?base.end:null;
  const lines=cell.split(/\n+|⏎+/).map(x=>x.trim()).filter(Boolean);
  if(lines.length>=2&&lines.some(l=>/[;；]/.test(l))){
    let cur=null;
    for(const ln of lines){
      if(/[;；]/.test(ln)){
        if(!cur)continue;
        const parts=ln.split(/[;；]/).map(x=>x.trim());
        out.push({ok:true,entry:{name:cur,teacher:parts[0]||null,room:parts[2]||null,day,start,end,color:PALETTE[(idx+cur.length)%PALETTE.length],weeks:parseWeeksStr(parts[1]||"")}});
        idx++;cur=null;
      }else cur=ln;
    }
    if(cur)out.push(parseCore(cur,idx,{day,start,end}));
    return;
  }
  cell.split(/\n+|；|;/).map(x=>x.trim()).filter(Boolean).forEach(sub=>{
    out.push(parseCore(sub,idx++,{day,start,end}));
  });
}
/* ===== v14 · 右栏「今日课程」列表：把一天按时间轴摊开，右栏不再空 ===== */
function renderTodayList(){
  var box=$("todayList"),badge=$("todayCount");
  if(!box)return;
  var list=coursesForDate(TODAY).slice().sort(function(a,b){return toMin(a.start)-toMin(b.start);});
  if(badge)badge.textContent=list.length?(list.length+" 节"):"休息日";
  var nowMin=new Date().getHours()*60+new Date().getMinutes();
  var CAL_SVG='<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M8 3v4M16 3v4M3.5 9.5h17"/><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/></svg>';
  if(!list.length){
    var nx=findNext(),hint="今天没有排课，好好休息 🌿";
    if(nx){
      var dd=(nx.dayDiff===0?"今天":(nx.dayDiff===1?"明天":("周"+DOW[nx.d.getDay()])));
      hint="下一节 · "+dd+" "+nx.c.start+" "+nx.c.name;
    }
    box.innerHTML='<div class="tl-empty">'+CAL_SVG+'<b>今天没有课</b><span>'+esc(hint)+'</span></div>';
    return;
  }
  box.innerHTML=list.map(function(c){
    var t=tinted(c.color),s=toMin(c.start),e=toMin(c.end);
    var ongoing=nowMin>=s&&nowMin<e,past=nowMin>=e;
    var meta=esc(c.room||"教室待定")+(c.teacher?(" · "+esc(c.teacher)):"");
    return '<button type="button" class="tl-row'+(ongoing?" ongoing":"")+(past?" past":"")+'" data-id="'+c.id+'">'+
      '<span class="tl-time"><b>'+c.start+'</b><i>'+c.end+'</i></span>'+
      '<span class="tl-bar" style="--c:'+t.c+'"></span>'+
      '<span class="tl-main"><span class="tl-name">'+esc(c.name)+'</span>'+
      '<span class="tl-meta">'+meta+'</span></span>'+
      (ongoing?'<span class="tl-live">进行中</span>':"")+
      '</button>';
  }).join("");
  box.querySelectorAll(".tl-row").forEach(function(r){
    r.addEventListener("click",function(){
      var c=COURSES.find(function(x){return String(x.id)===String(r.dataset.id);});
      if(c)openClass(c);
    });
  });
}

/* ===== v14 · 本周课程图例：点一下就把那张课卡闪给你看 ===== */
function renderLegend(){
  var box=$("legend");
  if(!box)return;
  var seen={},items=[],i;
  for(i=0;i<7;i++){
    coursesForDate(addDays(weekStart,i)).forEach(function(c){
      if(seen[c.id])return;
      seen[c.id]=1;items.push(c);
    });
  }
  items.sort(function(a,b){return (a.day-b.day)||(toMin(a.start)-toMin(b.start));});
  if(!items.length){box.innerHTML='<span class="lg-empty">本周没有排课</span>';return;}
  box.innerHTML=items.map(function(c){
    var t=tinted(c.color);
    return '<button type="button" class="lg-item" data-id="'+c.id+'" title="'+esc(c.name+" · 周"+DOW[c.day]+" "+c.start)+'">'+
      '<span class="lg-dot" style="--c:'+t.c+'"></span><span class="lg-name">'+esc(c.name)+'</span></button>';
  }).join("");
  box.querySelectorAll(".lg-item").forEach(function(b){
    b.addEventListener("click",function(){
      var c=COURSES.find(function(x){return String(x.id)===String(b.dataset.id);});
      if(c)focusCourse(c);
    });
  });
}
function focusCourse(c){
  if(view==="week"){
    var inWeek=false,i;
    for(i=0;i<7;i++){
      if(coursesForDate(addDays(weekStart,i)).some(function(x){return x.id===c.id;})){inWeek=true;break;}
    }
    if(inWeek){
      var block=document.querySelector('.cls[data-id="'+c.id+'"]');
      if(block){
        block.scrollIntoView({behavior:"smooth",block:"center",inline:"center"});
        block.classList.add("flash");
        setTimeout(function(){block.classList.remove("flash");},2000);
        return;
      }
    }
  }
  gotoCourse(c);
}

/* ===== v14 · 空教学周：给明确出口，不留一片空白网格 ===== */
function weekCourseCount(mon){
  var n=0,i;for(i=0;i<7;i++)n+=coursesForDate(addDays(mon,i)).length;return n;
}
function firstCourseWeek(){
  for(var w=0;w<30;w++){
    var mon=addDays(SEM_START,w*7);
    if(weekCourseCount(mon)>0)return mon;
  }
  return null;
}
function renderWeekEmpty(isEmpty){
  var cols=$("daycols");
  if(!cols||!cols.parentElement)return;
  var host=cols.parentElement;
  var old=host.querySelector(".week-empty");
  if(old)old.remove();
  if(!isEmpty)return;
  var target=firstCourseWeek();
  var wrap=document.createElement("div");
  wrap.className="week-empty";
  var acts="";
  if(target&&target.getTime()!==weekStart.getTime()){
    acts+='<button type="button" class="we-btn primary" data-act="jump">跳到第 '+semWeek(target)+' 教学周</button>';
  }
  acts+='<button type="button" class="we-btn ghost" data-act="month">看整月</button>';
  acts+='<button type="button" class="we-btn ghost" data-act="import">导入课表</button>';
  var desc=COURSES.length
    ?("这一周还没排课。最近的课在第 "+(target?semWeek(target):"—")+" 教学周，也可以切到月视图看整学期。")
    :"还没有课程数据，导入课表或手动添加后，这里就会排满。";
  wrap.innerHTML='<div class="we-in">'+
    '<div class="we-ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M8 3v4M16 3v4M3.5 9.5h17"/><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/></svg></div>'+
    '<div class="we-t">第 '+semWeek(weekStart)+' 教学周没有课</div>'+
    '<div class="we-d">'+esc(desc)+'</div>'+
    '<div class="we-acts">'+acts+'</div></div>';
  host.appendChild(wrap);
  wrap.querySelectorAll(".we-btn").forEach(function(b){
    b.addEventListener("click",function(){
      var a=b.dataset.act;
      if(a==="jump"&&target){weekStart=mondayOf(target);monthCur=new Date(target.getFullYear(),target.getMonth(),1);refresh();}
      else if(a==="month"){switchView("month");}
      else if(a==="import"){openImportSheet();}
    });
  });
}

/* ===== v14 · 右栏满高同步：侧栏高度贴着主表格走，消灭右下死空间 ===== */
var railRaf=0;
function syncRailHeight(){
  railRaf=0;
  var layout=document.querySelector(".layout");
  var main=document.querySelector(".main-col");
  if(!layout||!main)return;
  if(window.innerWidth<1024){layout.style.removeProperty("--rail-h");layout.style.removeProperty("--wk-max");return;}
  var wrapEl=document.querySelector(".wrap");
  var headEl=document.querySelector(".sched-head");
  var padB=wrapEl?(parseFloat(getComputedStyle(wrapEl).paddingBottom)||0):0;
  var scrollY=window.pageYOffset||document.documentElement.scrollTop||0;
  var mainTop=main.getBoundingClientRect().top+scrollY;
  var headH=headEl?headEl.offsetHeight:56;
  /* 主体可用高度 = 视口 − 主体文档顶 − wrap 底padding；整页不再滚动 */
  var avail=window.innerHeight-mainTop-padB;
  if(!(avail>240))avail=240;
  var wkMax=Math.round(avail-headH-2);
  if(wkMax<220)wkMax=220;
  layout.style.setProperty("--wk-max",wkMax+"px");
  void main.offsetHeight;                                  /* 强制回流，取收敛后的真实高度 */
  var mainH=main.offsetHeight||0;
  if(mainH<160)return;
  layout.style.setProperty("--rail-h",Math.round(mainH)+"px");   /* 右栏严格等高 → 零死空间 */
}
function queueRailSync(){
  if(railRaf)return;
  railRaf=requestAnimationFrame(syncRailHeight);
}
window.addEventListener("resize",queueRailSync);
function refresh(){renderWeek();renderMonth();renderNext();renderChips();renderTitle();renderTodayList();renderLegend();queueRailSync();}
refresh();
</script>
